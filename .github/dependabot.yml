version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/tools/agent-peer"]
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      rust-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      android-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: swift
    directory: "/apps/mobile/iosApp"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      swift-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/crates/host-daemon/src/visualize"
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      visualization-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/crates/host-daemon/src/claude/sdk"
    schedule:
      interval: weekly
      day: thursday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      claude-sdk-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: nix
    directories: ["/", "/tools/agent-peer"]
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      nix-inputs:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
