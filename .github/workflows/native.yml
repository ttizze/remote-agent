name: Native clients
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  # Contract tests mostly await isolated processes and network replies.
  NEXTEST_TEST_THREADS: 16
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check workflows and vendored visualization assets
        run: |
          nix develop .#native --command actionlint
          nix develop .#native --command npm --prefix crates/host-daemon/src/visualize ci --ignore-scripts --no-audit
          nix develop .#native --command npm --prefix crates/host-daemon/src/visualize run vendor
          git diff --exit-code -- crates/host-daemon/src/visualize
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust-version: ${{ steps.rust.outputs.version }}
      nextest-version: ${{ steps.rust.outputs.nextest-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - id: rust
        name: Read the pinned flake toolchain
        run: |
          echo "version=$(nix eval --raw .#devShells.x86_64-linux.native.RUST_TOOLCHAIN_VERSION)" >> "$GITHUB_OUTPUT"
          echo "nextest-version=$(nix eval --raw .#devShells.x86_64-linux.native.NEXTEST_VERSION)" >> "$GITHUB_OUTPUT"
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &free-space
        name: Free space for pinned Nix tools and Cargo builds
        run: |
          df -h /
          # These jobs use Nix tools, not the image's Android or .NET SDK.
          # Large binaries provide the space; unlinking every small file is slow.
          for sdk in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -d "$sdk" ]]; then
              sudo find "$sdk" -type f -size +10M -delete
            fi
          done
          df -h /
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop .#native --command {0}
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Build desktop and Host
        run: nix develop .#native --command cargo build --locked --features agent-core/bindings -p codex-app-server -p bex-process -p bex-desktop -p host-daemon
      - name: Orchestration and native contracts
        run: nix develop .#native --command cargo nextest run --locked --lib --bins --no-fail-fast --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p host-daemon -p xtask -p orchestration -p provider-adapters
      - name: Documentation examples
        run: nix develop .#native --command cargo test --locked --doc --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p host-daemon -p xtask -p orchestration -p provider-adapters
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *free-space
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: android-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Restore Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check Android and build app APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
          ANDROID_USER_HOME: ${{ runner.temp }}/android
        run: >-
          nix develop .#android --command ./gradlew
          :apps:mobile:ktfmtCheck

          :apps:mobile:assembleDebug
          --no-daemon --parallel --max-workers=4 --build-cache --console=plain
  macos:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      BEX_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NEXTEST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: macos-xcode-26.6-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Native contracts and iOS build
        run: nix develop . --command just quality apple
      - name: Build desktop and Host
        run: nix develop . --command cargo build --locked -p bex-desktop -p host-daemon -p bex-process
  windows:
    needs: toolchain
    # Latest stable Windows Server major; Windows 11 UI acceptance is separate.
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Native Windows consumes the version evaluated from the pinned flake.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ needs.toolchain.outputs.rust-version }}
      - name: Install the pinned test runner
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-nextest@${{ needs.toolchain.outputs.nextest-version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Build desktop and Host
        run: cargo build --locked --features agent-core/bindings -p codex-app-server -p bex-process -p bex-desktop -p host-daemon
      - name: Orchestration and native contracts
        run: cargo nextest run --locked --lib --bins --no-fail-fast --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p host-daemon -p xtask -p orchestration -p provider-adapters
      - name: Documentation examples
        run: cargo test --locked --doc --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p host-daemon -p xtask -p orchestration -p provider-adapters
