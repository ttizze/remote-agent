name: Native clients
# Client acceptance for the newest main revision; Portable checks (portable.yml)
# verify repository contracts and the Linux build for every revision.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  schedule:
    # Nightly iPhone acceptance in repeated fresh rounds, to measure flaky tests.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      desktop-release-tag:
        description: Published production tag to package for Windows; leave empty for CI
        type: string
        default: ''
      ios-tests:
        description: Space-separated iPhone UI test selectors; leave empty for full CI
        type: string
        default: ''
      ios-test-rounds:
        description: Fresh Simulator and Host rounds per iPhone runner, to measure flaky tests
        type: number
        default: 1
permissions:
  contents: read
concurrency:
  # The nightly measurement never displaces a pending main revision.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || inputs.desktop-release-tag || github.ref }}${{ inputs.ios-tests && '-focused' || '' }}
  # Finish a running main revision and keep only the newest pending revision.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  # Contract tests mostly await isolated processes and network replies.
  NEXTEST_TEST_THREADS: 16
jobs:
  changes:
    if: ${{ !inputs.desktop-release-tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      windows: ${{ steps.areas.outputs.windows }}
      android: ${{ steps.areas.outputs.android }}
      iphone: ${{ steps.areas.outputs.iphone }}
      mac: ${{ steps.areas.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request checks out a merge commit whose first parent is its base.
          fetch-depth: 2
      - id: areas
        name: Select client acceptance for files changed since the last verified main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_all() {
            printf '%s=true\n' windows android iphone mac >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)
              # Cancelled or failed runs leave their changes for the next push.
              if ! base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow native.yml --branch main --event push \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || \
                [[ -z "$base" ]] || ! git fetch --no-tags --depth=1 origin "$base"; then verify_all; fi
              ;;
            schedule)
              # The nightly measurement repeats only the iPhone acceptance.
              printf '%s=false\n' windows android mac >> "$GITHUB_OUTPUT"
              echo 'iphone=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *) verify_all ;;
          esac
          windows=false android=false iphone=false mac=false
          # Renames must retain both paths, including a moved Mac geometry fixture.
          if ! changed=$(git diff --no-renames --name-only "$base" HEAD); then verify_all; fi
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            # Unknown paths verify every client.
            case "$path" in
              docs/PRIVACY.md) area=all ;;
              cccc.toml | docs/* | AGENTS.md | CHANGELOG.md | README.md | README.ja.md | SECURITY.md | \
                lp/* | scripts/*.test.mjs | tools/windows-fxc/update.test.ps1 | \
                crates/agent-protocol/src/browser_input.test.cjs | crates/host-daemon/src/browser/password-fill.test.cjs | \
                apps/desktop/src/browser/native/snapshot.test.cjs) continue ;;
              tools/windows-fxc/* | scripts/package-windows.ps1 | scripts/windows-installer.iss) area=windows ;;
              apps/mobile/iosApp/Bex/ConversationScrollObserver.swift | apps/mobile/iosApp/Bex/ConversationTextLayout.swift | \
                apps/mobile/iosApp/UITests/Fixtures/scroll-tests.swift | apps/mobile/iosApp/UITests/Fixtures/text-view-tests.swift) area='iphone-mac' ;;
              # Mac runs the runner's unit tests; iPhone exercises its Simulator lifecycle.
              crates/xtask/src/ios_e2e.rs) area='iphone-mac' ;;
              scripts/test-ios-scroll.sh) area=mac ;;
              apps/mobile/src/* | apps/mobile/build.gradle.kts | build.gradle.kts | settings.gradle.kts | \
                gradle.properties | gradle/* | gradlew | gradlew.bat | detekt.yml | scripts/android-e2e.sh | \
                scripts/build-agent-android.mjs) area=android ;;
              apps/mobile/iosApp/* | .swiftformat | .swiftlint.yml | scripts/ios-e2e.sh | \
                scripts/build-agent-ios.sh | scripts/archive-ios.sh) area=iphone ;;
              apps/desktop/*) area=desktop ;;
              *) area=all ;;
            esac
            if [[ $area == all || $area == desktop || $area == windows ]]; then windows=true; fi
            if [[ $area == all || $area == android ]]; then android=true; fi
            if [[ $area == all || $area == iphone || $area == iphone-mac ]]; then iphone=true; fi
            # Only the UIKit geometry fixtures also compile Swift in the Mac job.
            if [[ $area == all || $area == mac || $area == iphone-mac || $area == desktop ]]; then mac=true; fi
          done <<< "$changed"
          printf 'windows=%s\nandroid=%s\niphone=%s\nmac=%s\n' "$windows" "$android" "$iphone" "$mac" | tee -a "$GITHUB_OUTPUT"
  toolchain:
    needs: changes
    if: ${{ !cancelled() && !inputs.ios-tests && (inputs.desktop-release-tag || needs.changes.outputs.windows == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust-version: ${{ steps.rust.outputs.version }}
      nextest-version: ${{ steps.rust.outputs.nextest-version }}
    steps:
      - &windows-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Delayed stages must use the event commit even when main advances.
          ref: ${{ inputs.desktop-release-tag || github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - id: rust
        name: Read the pinned flake toolchain
        run: |
          echo "version=$(nix eval --raw .#devShells.x86_64-linux.native.RUST_TOOLCHAIN_VERSION)" >> "$GITHUB_OUTPUT"
          echo "nextest-version=$(nix eval --raw .#devShells.x86_64-linux.native.NEXTEST_VERSION)" >> "$GITHUB_OUTPUT"
  android:
    needs: changes
    permissions:
      actions: write # Retire the preceding Gradle snapshot after saving its replacement.
      contents: write # Attach the tested Android preview APK on release publication.
    if: needs.changes.outputs.android == 'true' && !inputs.ios-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Android release signing and version
        if: github.event_name == 'release'
        env:
          AGENT_ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.BEX_ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: bash scripts/configure-android-preview.sh
      - name: Free space for pinned Nix tools and Cargo builds
        run: |
          # Project tools come from Nix; Actions' own Node runtimes live outside this tool cache.
          bash scripts/free-runner-space.sh /usr/local/lib/android /usr/share/dotnet \
            /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache
      - &prepare-zsh
        name: Prepare isolated Zsh startup for terminal tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/agent-zsh"
          : > "$RUNNER_TEMP/agent-zsh/.zshrc"
          echo "ZDOTDIR=$RUNNER_TEMP/agent-zsh" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop .#android-build --command {0}
          key: android-downloads-${{ hashFiles('flake.lock') }}
          # Gradle caches the JNI libraries and bindings, without Cargo intermediates.
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Restore Gradle dependencies and build outputs
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env:
          GRADLE_CACHE_PREFIX: bex-gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'gradle/wrapper/gradle-wrapper.properties') }}
        with:
          path: &gradle-cache-paths |
            ${{ runner.temp }}/gradle/caches
            ${{ runner.temp }}/gradle/wrapper
          key: ${{ env.GRADLE_CACHE_PREFIX }}-${{ github.sha }}
          restore-keys: ${{ env.GRADLE_CACHE_PREFIX }}-
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
        with:
          cache-provider: external
      - name: Check, test and build Android app and test APKs
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
          ANDROID_USER_HOME: ${{ runner.temp }}/android
        run: >-
          nix develop .#android-build --command ./gradlew
          :apps:mobile:ktfmtCheck :apps:mobile:detekt
          :apps:mobile:testDebugUnitTest
          :apps:mobile:assembleDebug :apps:mobile:assembleDebugAndroidTest
          --no-daemon --parallel --max-workers=4 --build-cache --console=plain
      - name: Save Gradle dependencies and completed native outputs
        id: save-gradle-cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-primary-key != '' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: *gradle-cache-paths
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Retire replaced Gradle snapshots
        if: ${{ steps.save-gradle-cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GRADLE_CACHE_KEY: ${{ steps.gradle-cache.outputs.cache-primary-key }}
        run: nix develop .#android-build --command node scripts/prune-build-cache.mjs "$GRADLE_CACHE_KEY"
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Restore Linux Host compiler dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: &host-rust-cache-command nix develop .#host-build --command {0}
          shared-key: &host-rust-cache-key wsl-runtime-host-build-${{ hashFiles('flake.lock') }}
          # The WSL job owns this cache; Android consumes its Host dependencies.
          save-if: false
      - name: Build isolated Android Host fixtures
        run: nix develop .#host-build --command cargo build --locked -p host-fixture -p codex-app-server -p agent-process --bins
      - name: Android emulator acceptance
        run: nix develop .#android-test --command bash scripts/android-e2e.sh
      - name: Retain Android acceptance logs and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-acceptance
          path: target/qa/android-*
          retention-days: 7
      - name: Package the tested Android preview APK
        run: |
          mkdir -p target/android-packages
          cp apps/mobile/build/outputs/apk/debug/mobile-debug.apk target/android-packages/bex-android-preview.apk
          cd target/android-packages
          sha256sum bex-android-preview.apk > bex-android-preview.apk.sha256
      - name: Retain the Android preview download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bex-android-preview
          path: target/android-packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Attach Android preview APK to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" target/android-packages/bex-android-preview.apk target/android-packages/bex-android-preview.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
  mac:
    name: Mac
    needs: changes
    permissions:
      actions: write # Retire the preceding compiler snapshot after saving its replacement.
      contents: read
    if: needs.changes.outputs.mac == 'true' && !inputs.ios-tests
    concurrency:
      # Optional PRs share one Apple slot; main and manual clients stay parallel.
      # github.job is unset before steps, so use explicit job names here.
      group: native-apple-${{ github.event_name == 'pull_request' && 'pr' || format('{0}-mac', github.run_id) }}
      cancel-in-progress: false
      queue: max
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      AGENT_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NEXTEST_TEST_THREADS: 6
    steps:
      - &apple-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &apple-xcode
        name: Use preinstalled Xcode 26.6
        run: |
          export DEVELOPER_DIR="$AGENT_XCODE_DEVELOPER_DIR"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          df -h /
      - &apple-nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - *prepare-zsh
      - id: dependency-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop .#native --command {0}
          key: macos-rust-xcode-26.6-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - &restore-local-rust-cache
        name: Restore compiled repository Rust crates
        id: local-rust-cache
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        env:
          AGENT_LOCAL_RUST_CACHE_PREFIX: local-rust-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('flake.lock', '.kache.toml', 'tools/kache/package.nix', 'scripts/ci-rust-cache.sh') }}-${{ github.job }}
        with:
          # Parent-directory metadata can still be updated by macOS housekeeping.
          path: &local-rust-cache-paths ${{ runner.temp }}/kache-store/*
          # Publish changed workspace sources too; preserve only the newest snapshot.
          key: ${{ env.AGENT_LOCAL_RUST_CACHE_PREFIX }}-${{ github.sha }}
          restore-keys: ${{ env.AGENT_LOCAL_RUST_CACHE_PREFIX }}-
      - name: Mac contracts and acceptance
        env: &local-rust-cache-env
          RUSTC_WRAPPER: ${{ github.workspace }}/scripts/ci-rust-cache.sh
          AGENT_CI_DEPENDENCIES_RESTORED: ${{ steps.dependency-cache.outputs.cache-hit }}
          KACHE_CACHE_DIR: ${{ runner.temp }}/kache-store
          KACHE_RUNTIME_DIR: ${{ runner.temp }}/kache-runtime
          # Hold a whole Mac build: a smaller store evicts its early, unchanged GPUI crates first.
          KACHE_MAX_SIZE: 8GiB
          # Bound the snapshot even when target/ still shares the cached files.
          KACHE_GC_EVICT_SHARED: '1'
          # Only the final sweep may change the store that is about to be archived.
          KACHE_AUTO_GC: '0'
        run: |
          set -o pipefail
          mkdir -p target/qa
          nix develop .#native --command bash -euo pipefail <<'CHECKS' 2>&1 | tee target/qa/quality.log
          just quality rust
          just apple-unit-tests
          just macos-e2e
          CHECKS
      - &finish-local-rust-cache
        name: Finish the local Rust compiler cache
        id: finish-local-rust-cache
        if: ${{ !cancelled() }}
        # A cache failure must not prevent acceptance of the completed build.
        # Save below only when shutdown succeeds; never snapshot a live store.
        continue-on-error: true
        env: *local-rust-cache-env
        run: nix develop '.#${{ github.job == 'mac' && 'native' || 'ios-build' }}' --command node scripts/finish-ci-rust-cache.mjs
      - &save-local-rust-cache
        name: Save compiled repository Rust crates
        id: save-local-rust-cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.ios-tests && steps.finish-local-rust-cache.outcome == 'success' && steps.local-rust-cache.outputs.cache-primary-key != '' && steps.local-rust-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: *local-rust-cache-paths
          key: ${{ steps.local-rust-cache.outputs.cache-primary-key }}
      - &prune-local-rust-cache
        name: Retire replaced repository compiler snapshots
        if: ${{ !cancelled() && steps.save-local-rust-cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILER_CACHE_KEY: ${{ steps.local-rust-cache.outputs.cache-primary-key }}
        run: nix develop '.#${{ github.job == 'mac' && 'native' || 'ios-build' }}' --command node scripts/prune-build-cache.mjs "$COMPILER_CACHE_KEY"
      - name: Retain Apple acceptance logs and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-macos-acceptance
          path: |
            target/qa/quality.log
            target/qa/Bex-*
          retention-days: 7
  iphone:
    name: iPhone build
    needs: changes
    permissions:
      actions: write # Retire the preceding Swift snapshot after saving its replacement.
      contents: read
    if: ${{ !cancelled() && needs.changes.outputs.iphone == 'true' }}
    concurrency:
      group: native-apple-${{ github.event_name == 'pull_request' && 'pr' || format('{0}-iphone', github.run_id) }}
      cancel-in-progress: false
      queue: max
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      AGENT_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NEXTEST_TEST_THREADS: 6
      AGENT_IOS_TESTS: ${{ inputs.ios-tests }}
      # The builders validate Swift content/toolchain hashes before reuse.
      AGENT_IOS_SWIFT_CACHE_PATHS: |
        target/qa/ios-derived-data
        target/qa/ios-markdown
        target/agent-bindings
        target/aarch64-apple-ios-sim/release/libAgentCore.a
        target/aarch64-apple-ios-sim/release/AgentCore.swiftmodule
        target/aarch64-apple-ios-sim/release/AgentCore.swiftdoc
        target/aarch64-apple-ios-sim/release/agent-core-swift.sha256
    steps:
      - *apple-checkout
      - *apple-xcode
      - *apple-nix
      - *prepare-zsh
      - id: dependency-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop .#ios-build --command {0}
          # Either Apple job may be unavailable; each must publish its own cache.
          key: macos-swift-xcode-26.6-${{ hashFiles('flake.lock') }}
          # Focused tests may omit the desktop renderer; only full builds publish.
          save-if: ${{ github.ref == 'refs/heads/main' && !inputs.ios-tests }}
          cache-on-failure: true
      - *restore-local-rust-cache
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: ios-cache
        continue-on-error: true
        with:
          path: ${{ env.AGENT_IOS_SWIFT_CACHE_PATHS }}
          key: >-
            ios-swift-xcode-26.6-${{ hashFiles(
              'flake.lock', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml',
              'crates/agent-bindgen/**', 'crates/agent-core/Cargo.toml', 'crates/agent-core/uniffi.toml',
              'crates/agent-core/src/**', 'crates/agent-ffi/**',
              'crates/agent-protocol/Cargo.toml', 'crates/agent-protocol/src/**',
              'crates/xtask/src/ios_*.rs', 'scripts/build-agent*.sh', 'apps/mobile/iosApp/**') }}
          restore-keys: ios-swift-xcode-26.6-
      - name: iPhone contracts and shared test build
        env: *local-rust-cache-env
        run: |
          set -o pipefail
          export AGENT_IOS_USE_CACHED_HOST_GRAPH="${{ steps.dependency-cache.outputs.cache-hit == 'true' && steps.local-rust-cache.outputs.cache-matched-key != '' }}"
          mkdir -p target/qa
          if [[ -n "$AGENT_IOS_TESTS" ]]; then
            read -r -a ios_tests <<< "$AGENT_IOS_TESTS"
            nix develop .#ios-build --command just ios-e2e --build-only "${ios_tests[@]}" 2>&1 | tee target/qa/quality.log
          else
            nix develop .#ios-build --command bash -euo pipefail <<'CHECKS' 2>&1 | tee target/qa/quality.log
          just quality swift
          just ios-markdown
          just conversation-ui --build-only
          CHECKS
          fi
      - name: Share the iPhone app, Host fixtures and test runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iphone-test-build
          path: target/qa/ios-e2e.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Save iPhone Swift builds
        id: save-ios-cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && !inputs.ios-tests && steps.ios-cache.outputs.cache-primary-key != '' && steps.ios-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.AGENT_IOS_SWIFT_CACHE_PATHS }}
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - name: Retire replaced iPhone Swift snapshots
        if: ${{ !cancelled() && steps.save-ios-cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFT_CACHE_KEY: ${{ steps.ios-cache.outputs.cache-primary-key }}
        run: nix develop .#ios-build --command node scripts/prune-build-cache.mjs "$SWIFT_CACHE_KEY"
      - *finish-local-rust-cache
      - *save-local-rust-cache
      - *prune-local-rust-cache
      - name: Retain Apple acceptance logs and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-iphone-build
          path: |
            target/qa/quality.log
            target/qa/Bex-*
          retention-days: 7
  iphone-tests:
    name: iPhone ${{ matrix.label }}
    needs: iphone
    if: ${{ !cancelled() && needs.iphone.result == 'success' }}
    concurrency:
      group: native-apple-${{ github.event_name == 'pull_request' && 'pr' || format('{0}-iphone-tests-{1}', github.run_id, matrix.label) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        # With Mac, three acceptance shards stay within the hosted macOS limit.
        include: ${{ fromJSON(inputs.ios-tests && '[{"shard":0,"label":"focused"}]' || '[{"shard":0,"label":"1/3"},{"shard":1,"label":"2/3"},{"shard":2,"label":"3/3"}]') }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      AGENT_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      AGENT_IOS_TEST_WORKERS: 2
      AGENT_IOS_TEST_SHARD: ${{ matrix.shard }}
      AGENT_IOS_TEST_SHARDS: ${{ inputs.ios-tests && 1 || 3 }}
      # The nightly measurement repeats every test in fresh Simulator and Host rounds.
      AGENT_IOS_TEST_ROUNDS: ${{ github.event_name == 'schedule' && 3 || inputs.ios-test-rounds || 1 }}
    steps:
      - *apple-checkout
      - *apple-xcode
      - name: List iPhone Simulator runtimes
        run: DEVELOPER_DIR="$AGENT_XCODE_DEVELOPER_DIR" xcrun simctl list runtimes
      - *apple-nix
      - *prepare-zsh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iphone-test-build
          path: target/qa
      - name: Restore the shared test build
        run: tar -xpzf target/qa/ios-e2e.tar.gz -C target
      - name: iPhone acceptance without rebuilding
        env:
          AGENT_IOS_TESTS: ${{ inputs.ios-tests }}
        run: |
          set -o pipefail
          if [[ -n "$AGENT_IOS_TESTS" ]]; then
            read -r -a ios_tests <<< "$AGENT_IOS_TESTS"
            nix develop .#ios-test --command just ios-e2e --prebuilt "${ios_tests[@]}" 2>&1 | tee target/qa/quality.log
          else
            nix develop .#ios-test --command just conversation-ui --prebuilt 2>&1 | tee target/qa/quality.log
          fi
      - name: Retain Apple acceptance logs and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-iphone-${{ matrix.shard }}-acceptance
          path: |
            target/qa/quality.log
            target/qa/Bex-*
          retention-days: 7
  wsl-runtime:
    needs: toolchain
    if: ${{ !cancelled() && needs.toolchain.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WSL_PROFILE: ${{ (github.event_name == 'release' || inputs.desktop-release-tag != '') && 'release' || 'dev' }}
    steps:
      - *windows-checkout
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: *host-rust-cache-command
          shared-key: *host-rust-cache-key
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and package the Linux Host for the Windows revision
        run: |
          AGENT_BUILD_REVISION=$(git rev-parse HEAD)
          export AGENT_BUILD_REVISION
          nix develop .#host-build --command cargo build --locked --profile "$WSL_PROFILE" -p host-daemon -p agent-process --bin host-daemon --bin agent-provider-supervisor
          directory=debug
          if [[ "$WSL_PROFILE" == release ]]; then directory=release; fi
          nix develop .#host-build --command node scripts/package-wsl-runtime.mjs "target/$directory" target/wsl-runtime
          nix develop .#host-build --command node scripts/verify-wsl-runtime.mjs target/wsl-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bex-wsl-runtime
          path: target/wsl-runtime
          if-no-files-found: error
          retention-days: 14
  windows:
    if: ${{ !cancelled() && needs.toolchain.result == 'success' && needs.wsl-runtime.result == 'success' }}
    needs: [toolchain, wsl-runtime]
    permissions:
      actions: read
      contents: write # Attach the verified Windows package to a published release.
    # Latest stable Windows Server major; Windows 11 UI acceptance is separate.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      AGENT_RELEASE_TAG: ${{ inputs.desktop-release-tag || github.event.release.tag_name }}
      # rust-cache prunes non-Cargo files inside target, leaving empty tool caches.
      AGENT_FXC_CACHE_ROOT: ${{ github.workspace }}/output/tool-cache/windows-fxc
    steps:
      - *windows-checkout
      - name: Require a verified production revision for release packaging
        if: inputs.desktop-release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:AGENT_RELEASE_TAG -notmatch '^prd-[1-9][0-9]*$') { throw "A production release tag is required." }
          $revision = git rev-parse HEAD
          foreach ($workflow in 'portable.yml', 'native.yml') {
            $verified = gh run list --repo "$env:GITHUB_REPOSITORY" --workflow $workflow --branch main --event push --commit "$revision" --status success --limit 1 --json headSha --jq '.[0].headSha // ""'
            if ($LASTEXITCODE -ne 0 -or $verified -ne $revision) { throw "This revision has not passed $workflow." }
          }
      # Native Windows consumes the version evaluated from the pinned flake.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          # Cargo's dependency cache retains FFF's build outputs; per-run Zig caches only evict them.
          use-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ needs.toolchain.outputs.rust-version }}
      - name: Install the pinned test runner
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-nextest@${{ needs.toolchain.outputs.nextest-version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-directories: ${{ env.AGENT_FXC_CACHE_ROOT }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bex-wsl-runtime
          path: target/wsl-runtime
      - name: Verify pinned shader compiler and reproducible bytecode
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/windows-fxc/verify.ps1
      - name: Compile GPUI shaders with the pinned compiler
        run: |
          $compiler = & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/windows-fxc/prepare.ps1
          if ($LASTEXITCODE -ne 0) { throw "Pinned FXC preparation failed." }
          "GPUI_FXC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Build desktop, Host and CLI
        if: ${{ !inputs.desktop-release-tag }}
        run: |
          cargo build --locked --features agent-core/bindings -p codex-app-server -p agent-process -p agent-desktop -p host-daemon -p agent-cli
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed." }
          $buildNumberPath = Join-Path $env:RUNNER_TEMP 'desktop-build-number.txt'
          $probe = Start-Process ./target/debug/agent-desktop.exe -ArgumentList '--bex-build-number' `
            -NoNewWindow -Wait -PassThru -RedirectStandardOutput $buildNumberPath
          $desktopBuildNumber = Get-Content -Raw $buildNumberPath
          if ($probe.ExitCode -ne 0 -or "$desktopBuildNumber".Trim() -ne "0") {
            throw "The desktop updater could not read the development build number."
          }
      - name: Install the SDK runtime beside the Host
        if: ${{ !inputs.desktop-release-tag }}
        run: node scripts/install-claude-sdk.mjs target/debug
      - name: Core contracts and isolated iroh Host
        if: ${{ !inputs.desktop-release-tag }}
        run: cargo nextest run --locked --no-fail-fast --features agent-core/bindings -p codex-app-server -p agent-process -p agent-protocol -p agent-transport -p agent-local-host -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Documentation examples
        if: ${{ !inputs.desktop-release-tag }}
        run: cargo test --locked --doc --features agent-core/bindings -p codex-app-server -p agent-process -p agent-protocol -p agent-transport -p agent-local-host -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Real-time passive approval soak
        if: github.event_name == 'workflow_dispatch' && !inputs.desktop-release-tag
        run: cargo test --locked -p host-fixture --test iroh_host passive_client_can_approve_after_five_minutes_without_reconnecting -- --ignored
      - name: Package verified Windows development binaries
        if: github.event_name != 'release' && !inputs.desktop-release-tag
        run: ./scripts/package-windows.ps1 -Profile dev -SkipBuild
      - name: Build and package Windows release
        if: github.event_name == 'release' || inputs.desktop-release-tag != ''
        run: |
          if ($env:AGENT_RELEASE_TAG -match '^prd-([1-9][0-9]*)$') { $env:AGENT_BUILD_NUMBER = $Matches[1] }
          ./scripts/package-windows.ps1 -Profile release
      - name: Retain the Windows package and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bex-windows-x86_64-${{ (github.event_name == 'release' || inputs.desktop-release-tag != '') && 'release' || 'dev' }}
          path: target/windows-packages/bex-windows-x86_64-*
          if-no-files-found: error
          retention-days: 14
      - name: Attach Windows package to the published release
        if: github.event_name == 'release' || inputs.desktop-release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.AGENT_RELEASE_TAG }}
        run: |
          gh release upload "$env:RELEASE_TAG" target/windows-packages/bex-windows-x86_64-setup.exe target/windows-packages/bex-windows-x86_64-setup.exe.sha256 target/windows-packages/bex-windows-x86_64-release.zip target/windows-packages/bex-windows-x86_64-release.zip.sha256 --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Windows release upload failed." }
  caches:
    name: Retire replaced dependency caches
    # Each Cargo.lock change publishes new dependency caches; the replaced ones
    # would otherwise push the repository over its cache budget and evict live caches.
    needs: [android, mac, iphone, iphone-tests, wsl-runtime, windows]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    # Cache maintenance must not invalidate successful client acceptance.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Keep only the newest dependency cache per job and toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#repository --command node scripts/prune-build-cache.mjs --dependencies
