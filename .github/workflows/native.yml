name: Native clients
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check workflows and vendored visualization assets
        run: |
          nix develop .#native --command actionlint
          nix develop .#native --command npm --prefix crates/host-daemon/src/visualize ci --ignore-scripts --no-audit
          nix develop .#native --command npm --prefix crates/host-daemon/src/visualize run vendor
          git diff --exit-code -- crates/host-daemon/src/visualize
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust-version: ${{ steps.rust.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - id: rust
        name: Read the pinned flake toolchain
        run: echo "version=$(nix eval --raw .#devShells.x86_64-linux.native.RUST_TOOLCHAIN_VERSION)" >> "$GITHUB_OUTPUT"
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free space for Nix and Cargo builds
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop .#native --command {0}
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Build desktop, Host and CLI
        run: nix develop .#native --command cargo build --locked -p codex-app-server -p bex-process -p bex-desktop -p host-daemon -p agent-cli
      - name: Core contracts and isolated iroh Host
        run: nix develop .#native --command cargo test --locked --no-fail-fast --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Real-time passive approval soak
        if: github.event_name == 'workflow_dispatch'
        run: nix develop .#native --command cargo test --locked -p host-fixture --test iroh_host passive_client_can_approve_after_five_minutes_without_reconnecting -- --ignored
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free space for the pinned Nix SDK
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: android-${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Check Android and build app and test APKs
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
          ANDROID_USER_HOME: ${{ runner.temp }}/android
        run: >-
          nix develop . --command ./gradlew
          :apps:mobile:ktfmtCheck :apps:mobile:detekt
          :apps:mobile:testDebugUnitTest
          :apps:mobile:assembleDebug :apps:mobile:assembleDebugAndroidTest
          --no-daemon --no-parallel --max-workers=2 --console=plain
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Build isolated Android Host fixtures
        run: nix develop .#native --command cargo build --locked -p host-fixture -p codex-app-server -p bex-process --bins
      - name: Android emulator acceptance
        run: nix develop .#android-test --command bash scripts/android-e2e.sh
  macos:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      BEX_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Share this 7 GiB Apple Silicon runner with the concurrent Mac WebView E2E.
      BEX_IOS_TEST_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select stable Xcode and free unused SDK space
        run: |
          export DEVELOPER_DIR="$BEX_XCODE_DEVELOPER_DIR"
          test -d "$DEVELOPER_DIR"
          selected_xcode=$(dirname "$(dirname "$DEVELOPER_DIR")")
          for xcode in /Applications/Xcode*.app; do
            if [[ $(realpath "$xcode") != "$selected_xcode" ]]; then
              sudo rm -rf "$xcode"
            fi
          done
          xcodebuild -version
          xcrun simctl list runtimes
          df -h /
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: macos-xcode-26.6-${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/qa/ios-derived-data
          key: ios-xcode-26.6-${{ hashFiles('flake.lock', 'Cargo.lock', 'apps/mobile/iosApp/Bex/**', 'apps/mobile/iosApp/BexUITests/**', 'apps/mobile/iosApp/Bex.xcodeproj/**') }}
          restore-keys: ios-xcode-26.6-
      - name: Mac contracts and concurrent Mac/iPhone E2E
        run: |
          mkdir -p target/qa
          nix develop . --command just quality 2>&1 | tee target/qa/quality.log
      - name: Retain Apple acceptance logs and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-acceptance
          path: |
            target/qa/quality.log
            target/qa/Bex-*
          retention-days: 7
  windows:
    needs: toolchain
    # Latest stable Windows Server major; Windows 11 UI acceptance is separate.
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Native Windows consumes the version evaluated from the pinned flake.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ needs.toolchain.outputs.rust-version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Build desktop, Host and CLI
        run: cargo build --locked -p codex-app-server -p bex-process -p bex-desktop -p host-daemon -p agent-cli
      - name: Core contracts and isolated iroh Host
        run: cargo test --locked --no-fail-fast --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Real-time passive approval soak
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked -p host-fixture --test iroh_host passive_client_can_approve_after_five_minutes_without_reconnecting -- --ignored
  verification:
    name: Native verification
    if: always()
    needs: [repository, toolchain, linux, android, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every verification job to succeed
        run: jq --exit-status 'all(.[]; .result == "success")' <<< "$JOB_RESULTS"
