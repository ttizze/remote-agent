name: Native clients
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios-test-rounds:
        description: Fresh Simulator and Host rounds per iPhone runner, to measure flaky tests
        type: number
        default: 1
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  # A newer main push waits, so every pushed change finishes verification.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: 4
  CARGO_INCREMENTAL: 0
  # Contract tests mostly await isolated processes and network replies.
  NEXTEST_TEST_THREADS: 16
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      android: ${{ steps.areas.outputs.android }}
      iphone: ${{ steps.areas.outputs.iphone }}
      mac: ${{ steps.areas.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request checks out a merge commit whose first parent is its base.
          fetch-depth: 2
      - id: areas
        name: Select client acceptance for files changed since the last verified main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_all() {
            printf '%s=true\n' android iphone mac >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)
              # Cancelled or failed runs leave their changes for the next push.
              base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow native.yml --branch main \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
              if [[ -z "$base" ]] || ! git fetch --no-tags --depth=1 origin "$base"; then verify_all; fi
              ;;
            *) verify_all ;;
          esac
          android=false iphone=false mac=false
          while IFS= read -r path; do
            # Unknown paths verify every client.
            case "$path" in
              docs/PRIVACY.md) area=all ;;
              docs/* | AGENTS.md | CHANGELOG.md | CONTEXT.md | README.md | README.ja.md | SECURITY.md) area=docs ;;
              apps/mobile/src/* | apps/mobile/build.gradle.kts | build.gradle.kts | settings.gradle.kts | \
                gradle.properties | gradle/* | gradlew | gradlew.bat | detekt.yml | scripts/android-e2e.sh) area=android ;;
              apps/mobile/iosApp/* | .swiftformat | .swiftlint.yml | scripts/ios-e2e.sh | \
                scripts/build-agent-ios.sh | scripts/archive-ios.sh) area=iphone ;;
              apps/desktop/*) area=desktop ;;
              *) area=all ;;
            esac
            if [[ $area == all || $area == android ]]; then android=true; fi
            if [[ $area == all || $area == iphone ]]; then iphone=true; fi
            # Mac Rust checks also render the iPhone Markdown fixtures.
            if [[ $area == all || $area == iphone || $area == desktop ]]; then mac=true; fi
          done < <(git diff --name-only "$base" HEAD)
          printf 'android=%s\niphone=%s\nmac=%s\n' "$android" "$iphone" "$mac" | tee -a "$GITHUB_OUTPUT"
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check workflows and vendored visualization assets
        run: |
          nix develop .#native --command actionlint
          nix develop .#native --command npm --prefix crates/host-daemon/src/visualize ci --ignore-scripts --no-audit
          nix develop .#native --command npm --prefix crates/host-daemon/src/visualize run vendor
          git diff --exit-code -- crates/host-daemon/src/visualize
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust-version: ${{ steps.rust.outputs.version }}
      nextest-version: ${{ steps.rust.outputs.nextest-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - id: rust
        name: Read the pinned flake toolchain
        run: |
          echo "version=$(nix eval --raw .#devShells.x86_64-linux.native.RUST_TOOLCHAIN_VERSION)" >> "$GITHUB_OUTPUT"
          echo "nextest-version=$(nix eval --raw .#devShells.x86_64-linux.native.NEXTEST_VERSION)" >> "$GITHUB_OUTPUT"
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &free-space
        name: Free space for pinned Nix tools and Cargo builds
        run: |
          df -h /
          # These jobs use Nix tools, not the image's Android or .NET SDK.
          # Large binaries provide the space; unlinking every small file is slow.
          for sdk in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -d "$sdk" ]]; then
              sudo find "$sdk" -type f -size +10M -delete
            fi
          done
          df -h /
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop .#native --command {0}
          key: ${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Build desktop, Host and CLI
        run: nix develop .#native --command cargo build --locked --features agent-core/bindings -p codex-app-server -p bex-process -p bex-desktop -p host-daemon -p agent-cli
      - name: Core contracts and isolated iroh Host
        run: nix develop .#native --command cargo nextest run --locked --no-fail-fast --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Documentation examples
        run: nix develop .#native --command cargo test --locked --doc --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Real-time passive approval soak
        if: github.event_name == 'workflow_dispatch'
        run: nix develop .#native --command cargo test --locked -p host-fixture --test iroh_host passive_client_can_approve_after_five_minutes_without_reconnecting -- --ignored
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - *free-space
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: android-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Restore Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check Android and build app and test APKs
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle
          ANDROID_USER_HOME: ${{ runner.temp }}/android
        run: >-
          nix develop . --command ./gradlew
          :apps:mobile:ktfmtCheck :apps:mobile:detekt
          :apps:mobile:testDebugUnitTest
          :apps:mobile:assembleDebug :apps:mobile:assembleDebugAndroidTest
          --no-daemon --parallel --max-workers=4 --build-cache --console=plain
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Build isolated Android Host fixtures
        run: nix develop .#native --command cargo build --locked -p host-fixture -p codex-app-server -p bex-process --bins
      - name: Android emulator acceptance
        run: nix develop .#android-test --command bash scripts/android-e2e.sh
      - name: Retain Android acceptance logs and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-acceptance
          path: target/qa/android-*
          retention-days: 7
  mac:
    name: Mac
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    concurrency:
      # Optional PRs share one Apple slot; main and manual clients stay parallel.
      group: native-apple-${{ github.event_name == 'pull_request' && 'pr' || format('{0}-{1}', github.run_id, github.job) }}
      cancel-in-progress: false
      queue: max
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      BEX_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NEXTEST_TEST_THREADS: 6
    steps:
      - &apple-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &apple-xcode
        name: Use preinstalled Xcode 26.6
        run: |
          export DEVELOPER_DIR="$BEX_XCODE_DEVELOPER_DIR"
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun simctl list runtimes
          df -h /
      - &apple-nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          # Mac contracts also compile GPUI; keep that cache off iPhone runners.
          key: macos-rust-xcode-26.6-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Mac contracts and acceptance
        run: |
          set -o pipefail
          mkdir -p target/qa
          nix develop . --command just quality rust 2>&1 | tee target/qa/quality.log
      - name: Retain Apple acceptance logs and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-macos-acceptance
          path: |
            target/qa/quality.log
            target/qa/Bex-*
          retention-days: 7
  iphone:
    name: iPhone ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.iphone == 'true'
    concurrency:
      group: native-apple-${{ github.event_name == 'pull_request' && 'pr' || format('{0}-{1}-{2}', github.run_id, github.job, matrix.label) }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include:
          # With Mac, four jobs stay within the hosted macOS concurrency limit.
          - { shard: 0, label: 1/3 }
          - { shard: 1, label: 2/3 }
          - { shard: 2, label: 3/3 }
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      BEX_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NEXTEST_TEST_THREADS: 6
      # The iPhone runner has its own Host and one Simulator on a 7 GiB Mac.
      BEX_IOS_TEST_WORKERS: 1
      BEX_IOS_TEST_SHARD: ${{ matrix.shard }}
      BEX_IOS_TEST_SHARDS: 3
      BEX_IOS_TEST_ROUNDS: ${{ inputs.ios-test-rounds || 1 }}
      # The builders validate Swift content/toolchain hashes before reuse.
      BEX_IOS_SWIFT_CACHE_PATHS: |
        target/qa/ios-derived-data
        target/qa/ios-markdown
        target/agent-bindings
        target/aarch64-apple-ios-sim/release/libAgentCore.a
        target/aarch64-apple-ios-sim/release/AgentCore.swiftmodule
        target/aarch64-apple-ios-sim/release/AgentCore.swiftdoc
        target/aarch64-apple-ios-sim/release/agent-core-swift.sha256
    steps:
      - *apple-checkout
      - *apple-xcode
      - *apple-nix
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: macos-swift-xcode-26.6-${{ hashFiles('flake.lock') }}
          save-if: ${{ github.event_name != 'pull_request' && matrix.shard == 0 }}
          cache-on-failure: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: ios-cache
        with:
          path: ${{ env.BEX_IOS_SWIFT_CACHE_PATHS }}
          key: ios-swift-xcode-26.6-${{ hashFiles('flake.lock', 'Cargo.lock', 'crates/agent-core/src/**', 'crates/agent-protocol/src/**', 'crates/xtask/src/ios_markdown.rs', 'scripts/build-agent*.sh', 'apps/mobile/iosApp/**') }}
          restore-keys: ios-swift-xcode-26.6-
      - name: iPhone contracts and acceptance
        run: |
          set -o pipefail
          mkdir -p target/qa
          nix develop . --command just quality swift 2>&1 | tee target/qa/quality.log
      - name: Save iPhone Swift builds once for all shards
        if: ${{ !cancelled() && github.event_name != 'pull_request' && matrix.shard == 0 && steps.ios-cache.outputs.cache-primary-key != '' && steps.ios-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BEX_IOS_SWIFT_CACHE_PATHS }}
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - name: Retain Apple acceptance logs and result bundles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apple-iphone-${{ matrix.shard }}-acceptance
          path: |
            target/qa/quality.log
            target/qa/Bex-*
          retention-days: 7
  windows:
    needs: toolchain
    # Latest stable Windows Server major; Windows 11 UI acceptance is separate.
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Native Windows consumes the version evaluated from the pinned flake.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ needs.toolchain.outputs.rust-version }}
      - name: Install the pinned test runner
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: cargo-nextest@${{ needs.toolchain.outputs.nextest-version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          cache-on-failure: true
      - name: Build desktop, Host and CLI
        run: cargo build --locked --features agent-core/bindings -p codex-app-server -p bex-process -p bex-desktop -p host-daemon -p agent-cli
      - name: Core contracts and isolated iroh Host
        run: cargo nextest run --locked --no-fail-fast --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Documentation examples
        run: cargo test --locked --doc --features agent-core/bindings -p codex-app-server -p bex-process -p agent-protocol -p agent-transport -p agent-core -p agent-cli -p host-daemon -p host-fixture -p xtask
      - name: Real-time passive approval soak
        if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked -p host-fixture --test iroh_host passive_client_can_approve_after_five_minutes_without_reconnecting -- --ignored
