name: BEX browser startup diagnostic
on:
  push:
    branches: [bex/session-3cc712a6-3fd7-4819-84ca-dabf6082937e]
permissions:
  contents: read
jobs:
  browser:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      BEX_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          shared-key: macos-xcode-26.6-${{ hashFiles('flake.lock') }}-macos
          cache-on-failure: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/qa/ios-derived-data
          key: ios-xcode-26.6-${{ hashFiles('flake.lock', 'Cargo.lock', 'apps/mobile/iosApp/Bex/**', 'apps/mobile/iosApp/BexUITests/**', 'apps/mobile/iosApp/Bex.xcodeproj/**') }}
          restore-keys: ios-xcode-26.6-
      - name: Measure the browser acceptance case
        run: |
          set -o pipefail
          mkdir -p target/qa
          cat > target/qa/chrome-ci <<'SH'
          #!/bin/sh
          date -u '+Chrome wrapper entered at %Y-%m-%dT%H:%M:%SZ' >> "$BEX_CHROME_LOG"
          exec "/Applications/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" --use-mock-keychain "$@" 2>> "$BEX_CHROME_LOG"
          SH
          chmod 700 target/qa/chrome-ci
          export BEX_BROWSER_EXECUTABLE="$PWD/target/qa/chrome-ci"
          export BEX_CHROME_LOG="$PWD/target/qa/chrome.log"
          nix develop . --command scripts/ios-e2e.sh testSimulatorBrowserIsSeparateFromConversationAndPreservesPage 2>&1 | tee target/qa/quality.log
      - name: Show browser startup measurements
        if: always()
        run: |
          test ! -f target/qa/chrome.log || cat target/qa/chrome.log
          find target/qa -name '*.host.log' -exec cat {} \;
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-startup-diagnostic
          path: |
            target/qa/chrome.log
            target/qa/quality.log
            target/qa/Bex-*
          retention-days: 3
