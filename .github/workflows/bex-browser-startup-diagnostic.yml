name: BEX browser startup diagnostic
on:
  push:
    branches: [bex/session-3cc712a6-3fd7-4819-84ca-dabf6082937e]
permissions:
  contents: read
jobs:
  startup:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BEX_IOS_TEST_WORKERS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: macos-xcode-26.6-${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/qa/ios-derived-data
          key: ios-xcode-26.6-${{ hashFiles('flake.lock', 'Cargo.lock', 'apps/mobile/iosApp/Bex/**', 'apps/mobile/iosApp/BexUITests/**', 'apps/mobile/iosApp/Bex.xcodeproj/**') }}
          restore-keys: ios-xcode-26.6-
      - name: Capture Chrome startup during the isolated browser UI case
        run: |
          mkdir -p target/qa
          export BEX_BROWSER_DIAGNOSTIC_LOG="$PWD/target/qa/chrome-startup.log"
          export BEX_BROWSER_EXECUTABLE="$PWD/target/qa/chrome-startup-wrapper"
          cat > "$BEX_BROWSER_EXECUTABLE" <<'SH'
          #!/bin/sh
          exec "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" "$@" 2>> "$BEX_BROWSER_DIAGNOSTIC_LOG"
          SH
          chmod 700 "$BEX_BROWSER_EXECUTABLE"
          nix develop . --command just ios-e2e \
            testSimulatorBrowserIsSeparateFromConversationAndPreservesPage \
            testSimulatorNativeTerminalRetainsShellAfterReopening \
            testSimulatorOpensLongInterruptedHistoryAtLatestMessage \
            testSimulatorUsesNativeProjectDisclosureAndDirectoryNavigation
      - name: Show isolated Chrome startup diagnostics
        if: always()
        run: test ! -f target/qa/chrome-startup.log || tail -n 60 target/qa/chrome-startup.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-startup-diagnostic
          path: |
            target/qa/chrome-startup.log
            target/qa/Bex-*
          retention-days: 3
