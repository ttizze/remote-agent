name: Android candidate
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing draft candidate whose Android package needs rebuilding
        type: string
        required: true
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
    secrets:
      BEX_ANDROID_KEYSTORE_BASE64:
        required: true
      BEX_ANDROID_KEYSTORE_PASSWORD:
        required: true
permissions:
  actions: read
  contents: write
concurrency:
  group: android-candidate-${{ inputs.release-tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
      GRADLE_USER_HOME: /tmp/agent-gradle
      ANDROID_USER_HOME: /tmp/agent-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release-tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require a verified draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          [[ $CANDIDATE_TAG =~ ^(nightly|prd)-[1-9][0-9]*$ ]]
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          revision=$(git rev-parse HEAD)
          for workflow in portable.yml native.yml; do
            verified=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main \
              --event push --commit "$revision" --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            test "$verified" = "$revision"
          done
      - name: Free build space
        run: |
          for sdk in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -d "$sdk" ]]; then
              sudo find "$sdk" -type f -size +10M -delete
            fi
          done
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: android-download-${{ hashFiles('flake.lock', 'tools/cargo/package.nix') }}
          cache-targets: false
          cache-directories: ~/.cargo/targets
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Initialize pinned tooling before loading signing credentials
        run: scripts/dev-env.sh true
      - name: Configure stable distribution signing and version
        env:
          AGENT_ANDROID_KEYSTORE_BASE64: ${{ secrets.BEX_ANDROID_KEYSTORE_BASE64 }}
          AGENT_ANDROID_KEY_ALIAS: ${{ vars.BEX_ANDROID_KEY_ALIAS }}
        run: bash scripts/configure-android-signing.sh
      - name: Test and build the signed Android candidate
        env:
          AGENT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BEX_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # AGP 9 creates debug unit tests by default; explicitly enable the release test component.
          nix develop . --command ./gradlew -Pandroid.onlyEnableUnitTestForTheTestedBuildType=false \
            :apps:mobile:testReleaseUnitTest :apps:mobile:lintRelease :apps:mobile:assembleRelease \
            --no-daemon --max-workers=4 --build-cache --console=plain || {
              cat apps/mobile/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt 2>/dev/null || true
              exit 1
            }
      - name: Retain Android verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-verification-reports
          path: |
            apps/mobile/build/reports/
            apps/mobile/build/test-results/
            target/qa/android-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Package APK and checksum
        run: |
          mkdir -p target/android-packages
          cp apps/mobile/build/outputs/apk/release/mobile-release.apk target/android-packages/bex-android.apk
          cd target/android-packages
          sha256sum bex-android.apk > bex-android.apk.sha256
      - name: Verify APK installation requirements and signature
        run: nix develop . --command bash scripts/verify-android-apk.sh target/android-packages/bex-android.apk 26
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bex-android-preview
          path: target/android-packages/*
          if-no-files-found: error
      - name: Attach the signed APK to the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$CANDIDATE_TAG" target/android-packages/bex-android.apk target/android-packages/bex-android.apk.sha256 --repo "$GITHUB_REPOSITORY"
