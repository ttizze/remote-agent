name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [rust, elixir, kotlin, swift]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Fetch Elixir dependencies
        if: matrix.language == 'elixir'
        working-directory: apps/server
        run: nix develop ../.. --command mix deps.get --check-locked
      - name: Check ${{ matrix.language }}
        run: nix develop . --command cargo xtask quality ${{ matrix.language }}
