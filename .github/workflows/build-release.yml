name: Build release
on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      channel:
        type: string
        required: true
      source-tag:
        type: string
        default: ''
    outputs:
      tag:
        value: ${{ jobs.release.outputs.tag }}
permissions:
  contents: read
env:
  AGENT_RELEASE_SHA: ${{ inputs.source-sha }}
  AGENT_RELEASE_CHANNEL: ${{ inputs.channel }}
  AGENT_SOURCE_TAG: ${{ inputs.source-tag }}
jobs:
  release:
    # Skipped PR and failed-build notifications must not replace a queued release.
    concurrency:
      group: apple-release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      actions: read
      contents: write
    env:
      AGENT_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      AGENT_DISTRIBUTION_SIGNING: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AGENT_RELEASE_SHA }}
          persist-credentials: false
      - name: Verify the source revision and pinned Xcode
        run: |
          test "$(git rev-parse HEAD)" = "$AGENT_RELEASE_SHA"
          test -d "$AGENT_XCODE_DEVELOPER_DIR"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Initialize pinned tooling before loading signing secrets
        run: scripts/dev-env.sh true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: apple-release-xcode-26.6-${{ hashFiles('flake.lock', 'tools/cargo/package.nix') }}
          cache-targets: false
          cache-directories: ~/.cargo/targets
          cache-on-failure: true
      - name: Restore iPhone archive dependencies and compiler cache
        id: ios-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/apple-release/DerivedData
          key: ios-release-xcode-26.6-${{ env.AGENT_RELEASE_SHA }}
          restore-keys: ios-release-xcode-26.6-
      - name: Prepare dedicated non-interactive signing keychain
        env:
          AGENT_SIGNING_KEYCHAIN_BASE64: ${{ secrets.BEX_SIGNING_KEYCHAIN_BASE64 }}
          AGENT_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.BEX_SIGNING_KEYCHAIN_PASSWORD }}
          AGENT_ASC_PRIVATE_KEY: ${{ secrets.BEX_ASC_PRIVATE_KEY }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: scripts/dev-env.sh node scripts/apple-signing.ts prepare
      - name: Allocate one new build number for Mac and iPhone
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: |
          mkdir -p target/apple-release
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName > target/apple-release/releases.json
          scripts/dev-env.sh node scripts/apple-release.ts plan
      - name: Build, notarize, archive and upload the verified revision
        env:
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: scripts/dev-env.sh bash scripts/release-apple.sh
      - name: Save iPhone archive dependencies and compiler cache
        id: save-ios-cache
        if: ${{ !cancelled() && steps.ios-cache.outputs.cache-primary-key != '' && steps.ios-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/apple-release/DerivedData
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - name: Retire replaced iPhone archive snapshots
        if: ${{ !cancelled() && steps.save-ios-cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CACHE_KEY: ${{ steps.ios-cache.outputs.cache-primary-key }}
        run: scripts/dev-env.sh node scripts/prune-build-cache.ts "$RELEASE_CACHE_KEY"
      - name: Verify the iPhone distribution build
        env:
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: scripts/dev-env.sh node scripts/apple-release.ts verify
      - name: Stage the release packages
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f "ref=refs/tags/$AGENT_RELEASE_TAG" -f "sha=$AGENT_RELEASE_SHA" > /dev/null
          files=(target/apple-release/bex-macOS-arm64.zip target/apple-release/bex-macOS-arm64.zip.sha256 target/apple-release/apple-build.json)
          flags=(--draft)
          if [[ $AGENT_RELEASE_CHANNEL == nightly ]]; then
            files+=(target/apple-release/bex-iOS-preview.ipa target/apple-release/bex-iOS-preview.ipa.sha256)
            flags+=(--prerelease)
          fi
          gh release create "$AGENT_RELEASE_TAG" "${files[@]}" "${flags[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$AGENT_RELEASE_SHA" \
            --title "BEX $AGENT_RELEASE_CHANNEL $AGENT_BUILD_NUMBER" \
            --notes "Source: $AGENT_RELEASE_SHA. Channel: $AGENT_RELEASE_CHANNEL."
          echo "tag=$AGENT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Remove signing credentials
        if: always()
        run: scripts/dev-env.sh node scripts/apple-signing.ts cleanup
  windows:
    needs: release
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/native.yml
    with:
      release-tag: ${{ needs.release.outputs.tag }}
  android:
    needs: release
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/android-download.yml
    with:
      release-tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
  publish:
    needs: [release, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AGENT_RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Load App Store credentials for stable release submission
        if: inputs.channel == 'stable'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.BEX_ASC_PRIVATE_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/bex-asc.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          echo "AGENT_ASC_PRIVATE_KEY_FILE=$key" >> "$GITHUB_ENV"
      - name: Verify packages and publish Nightly or submit stable for review
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
          CANDIDATE_TAG: ${{ needs.release.outputs.tag }}
        run: scripts/dev-env.sh node scripts/release-candidate.ts seal "$CANDIDATE_TAG"
      - name: Remove App Store credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/bex-asc.p8"
