name: Apple release
on:
  workflow_run:
    workflows: [Native clients]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
env:
  AGENT_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  verification:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      actions: read
    steps:
      - name: Require both workflows to verify this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in portable.yml native.yml; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch main \
              --event push --commit "$AGENT_RELEASE_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // ""')
            test -n "$run"
            # Native acceptance may finish before Portable checks. Wait on Linux
            # before allocating the signing runner; only Native clients triggers release.
            gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
          done
  release:
    needs: verification
    # Skipped PR and failed-build notifications must not replace a queued release.
    concurrency:
      group: apple-release
      cancel-in-progress: false
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      actions: write # Dispatch Windows packaging after publishing this exact release.
      contents: write
    env:
      AGENT_XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      AGENT_DISTRIBUTION_SIGNING: '1'
      AGENT_TESTFLIGHT_GROUP: BEX External
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AGENT_RELEASE_SHA }}
          persist-credentials: false
      - name: Verify the source revision and pinned Xcode
        run: |
          test "$(git rev-parse HEAD)" = "$AGENT_RELEASE_SHA"
          test -d "$AGENT_XCODE_DEVELOPER_DIR"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Initialize pinned tooling before loading signing secrets
        run: scripts/dev-env.sh true
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cmd-format: nix develop . --command {0}
          key: apple-release-xcode-26.6-${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Restore iPhone archive dependencies and compiler cache
        id: ios-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/apple-release/DerivedData
          key: ios-release-xcode-26.6-${{ env.AGENT_RELEASE_SHA }}
          restore-keys: ios-release-xcode-26.6-
      - name: Prepare dedicated non-interactive signing keychain
        env:
          AGENT_SIGNING_KEYCHAIN_BASE64: ${{ secrets.BEX_SIGNING_KEYCHAIN_BASE64 }}
          AGENT_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.BEX_SIGNING_KEYCHAIN_PASSWORD }}
          AGENT_ASC_PRIVATE_KEY: ${{ secrets.BEX_ASC_PRIVATE_KEY }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: scripts/dev-env.sh node scripts/apple-signing.mjs prepare
      - name: Allocate one new build number for Mac and iPhone
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: |
          mkdir -p target/apple-release
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName > target/apple-release/releases.json
          scripts/dev-env.sh node scripts/apple-release.mjs plan
      - name: Build, notarize, archive and upload the verified revision
        env:
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: scripts/dev-env.sh bash scripts/release-apple.sh
      - name: Save iPhone archive dependencies and compiler cache
        id: save-ios-cache
        if: ${{ !cancelled() && steps.ios-cache.outputs.cache-primary-key != '' && steps.ios-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/apple-release/DerivedData
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - name: Retire replaced iPhone archive snapshots
        if: ${{ !cancelled() && steps.save-ios-cache.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CACHE_KEY: ${{ steps.ios-cache.outputs.cache-primary-key }}
        run: scripts/dev-env.sh node scripts/prune-build-cache.mjs "$RELEASE_CACHE_KEY"
      - name: Verify Apple processing and distribute to TestFlight
        env:
          AGENT_ASC_KEY_ID: ${{ secrets.BEX_ASC_KEY_ID }}
          AGENT_ASC_ISSUER_ID: ${{ secrets.BEX_ASC_ISSUER_ID }}
        run: scripts/dev-env.sh node scripts/apple-release.mjs verify
      - name: Publish the notarized Mac download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Mac and TestFlight build %s.\n\n[iPhone: Get on TestFlight](https://testflight.apple.com/join/UJbK9Ww7)\n\nSource commit: %s\n\nRelease verification: https://github.com/%s/actions/runs/%s\n' \
            "$AGENT_BUILD_NUMBER" "$AGENT_RELEASE_SHA" "$GITHUB_REPOSITORY" \
            "${{ github.run_id }}" > target/apple-release/release-notes.txt
          gh release create "$AGENT_RELEASE_TAG" target/apple-release/bex-macOS-arm64.zip \
            target/apple-release/bex-macOS-arm64.zip.sha256 --repo "$GITHUB_REPOSITORY" \
            --target "$AGENT_RELEASE_SHA" --title "BEX ${AGENT_BUILD_NUMBER}" \
            --notes-file target/apple-release/release-notes.txt
          # GITHUB_TOKEN release events do not trigger Native clients. Dispatch
          # the existing Windows packager explicitly for the same verified tag.
          gh workflow run native.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "desktop-release-tag=$AGENT_RELEASE_TAG"
      - name: Remove signing credentials
        if: always()
        run: scripts/dev-env.sh node scripts/apple-signing.mjs cleanup
