[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
bindings = ["dep:uniffi", "dep:zeroize"]
diagrams = ["dep:mermaid-rs-renderer"]

[dependencies]
agent-protocol = { path = "../agent-protocol" }
agent-transport = { path = "../agent-transport" }
uniffi = { version = "=0.32.2", features = ["tokio"], optional = true }
zeroize = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4", "serde", "v5"] }
futures-util.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = { version = "0.1", default-features = false }
thiserror.workspace = true
scopeguard = "1.2"
markdown = "=1.0.0"
url.workspace = true
percent-encoding = "2.3"
syntect = { version = "=5.3.0", default-features = false, features = ["default-fancy"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false, optional = true }
base64.workspace = true

[dev-dependencies]
ring.workspace = true
tempfile = "3"
insta = { version = "1.46", default-features = false, features = ["json"] }
proptest = "1.11"
rstest = { version = "0.27", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
