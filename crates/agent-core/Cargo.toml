[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bindings = ["dep:uniffi", "dep:zeroize"]

[dependencies]
agent-protocol = { path = "../agent-protocol" }
agent-transport = { path = "../agent-transport" }
uniffi = { version = "=0.32.0", features = ["tokio"], optional = true }
zeroize = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4", "serde", "v5"] }
futures-util.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
tokio-stream = { version = "0.1", default-features = false }
thiserror.workspace = true
scopeguard = "1.2"
markdown = "=1.0.0"

[dev-dependencies]
base64.workspace = true
ring.workspace = true
tempfile = "3"
insta = { version = "1.46", default-features = false, features = ["json"] }
rstest = { version = "0.27", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
