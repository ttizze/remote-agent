[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
bindings = ["dep:uniffi", "dep:zeroize"]

[dependencies]
agent-protocol = { path = "../agent-protocol" }
agent-domain = { path = "../agent-domain" }
agent-transport = { path = "../agent-transport" }
uniffi = { version = "=0.32.0", features = ["tokio"], optional = true }
zeroize = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4", "serde", "v5"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
scopeguard = "1.2"
markdown = "=1.0.0"

[dev-dependencies]
tempfile = "3"
insta = { version = "1.46", default-features = false, features = ["json"] }
proptest = "1.11"
rstest = { version = "0.27", default-features = false }
