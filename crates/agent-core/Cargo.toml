[package]
name = "agent-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
bindings = ["dep:uniffi", "dep:zeroize"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi = { version = "=0.32.0", features = ["tokio"], optional = true }
zeroize = { workspace = true, optional = true }
iroh = { version = "=1.1.0", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-tickets = "=1.0.0"
uuid = { version = "1", features = ["v4", "serde", "v5"] }
futures-util.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
base64.workspace = true
ring.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
tokio-stream = { version = "0.1", default-features = false }
thiserror.workspace = true
tempfile = "3"
scopeguard = "1.2"
pin-project-lite = "0.2"
regex = "1"
markdown = "=1.0.0"
url.workspace = true

[dev-dependencies]
insta = { version = "1.46", default-features = false, features = ["json"] }
rstest = { version = "0.27", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
