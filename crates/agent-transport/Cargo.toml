[package]
name = "agent-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent-protocol = { path = "../agent-protocol" }
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-tickets = "=1.0.0"
uuid = { version = "1", features = ["v4", "serde", "v5"] }
futures-util.workspace = true
ring.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
thiserror.workspace = true
tempfile = "3"
scopeguard = "1.2"
pin-project-lite = "0.2"
regex = "1"
zstd = { version = "0.14.3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.12"
tokio = { workspace = true, features = ["process", "test-util"] }
