[package]
name = "host-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-core = { path = "../agent-core" }
keyring = "4.2"
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
base64.workspace = true
codex-app-server = { path = "../codex-app-server" }
ring.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "multipart", "json", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake", "futures-03-sink", "tokio-rustls-native-certs"] }
futures-io = "0.3"
tokio-util.workspace = true
zeroize.workspace = true
tempfile = "3"
scopeguard = "1.2"
atomicwrites = "0.4.4"

[dev-dependencies]
# Match desktop builds even when CI tests only the headless packages. With both
# backends enabled, cold dictation must select a provider before starting TLS.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde_json.workspace = true
