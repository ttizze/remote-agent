[package]
name = "host-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
async-trait = "0.1.92"
tracing.workspace = true
agent-process = { path = "../agent-process" }
agent-local-host = { path = "../agent-local-host" }
agent-protocol = { path = "../agent-protocol" }
agent-transport = { path = "../agent-transport" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4.6", features = ["derive"] }
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp"] }
resvg = { version = "0.49.0", default-features = false }
regex = "1"
cssparser = "0.37"
roxmltree = "0.21"
memchr = "2"
codex-app-server = { path = "../codex-app-server" }
ring.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "multipart", "json", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "net", "process", "signal"] }
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake", "futures-03-sink", "tokio-rustls-platform-verifier"] }
futures-io = "0.3"
tokio-util.workspace = true
zeroize = { workspace = true, features = ["serde"] }
url.workspace = true
tempfile = "3"
scopeguard = "1.2"
atomicwrites = "0.4.4"
anyhow.workspace = true
dunce.workspace = true
libc = "0.2"
which = "8.0.6"
alacritty_terminal = "=0.26.0"
# T3's fff-node 0.11.0 uses this release of the Rust search engine.
fff-search = { git = "https://github.com/dmtrKovalenko/fff", rev = "95fd777c2529fc7b4d7572dabff64cc07268f2c5", default-features = false, features = ["ripgrep"] }
rusqlite = { version = "0.41", features = ["bundled"] }
cap-std = "=4.0.3"

[dev-dependencies]
agent-protocol = { path = "../agent-protocol", features = ["test-support"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
proptest = "1.12"
rstest = { version = "0.28", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
# Exercise the real client Store and rendering against Host behavior.
agent-core = { path = "../agent-core" }
# Match desktop builds even when CI tests only the headless packages. With both
# backends enabled, cold dictation must select a provider before starting TLS.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = "0.13"
sha1 = "0.11"
sha2 = "0.11"
security-framework = "3"
