[package]
name = "host-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
tracing.workspace = true
bex-process = { path = "../bex-process" }
agent-protocol = { path = "../agent-protocol" }
agent-transport = { path = "../agent-transport" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive"] }
base64.workspace = true
codex-app-server = { path = "../codex-app-server" }
zstd = "0.13.3"
ring.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "multipart", "json", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = { version = "1.0.28", features = ["serde"] }
regex = "1"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "net"] }
async-tungstenite = { version = "0.35", default-features = false, features = ["handshake", "futures-03-sink", "tokio-rustls-platform-verifier"] }
futures-io = "0.3"
tokio-util.workspace = true
zeroize.workspace = true
tempfile = "3"
scopeguard = "1.2"
shell-words = "1.1.1"
indexmap = "2"
atomicwrites = "0.4.4"
anyhow.workspace = true
dunce.workspace = true
alacritty_terminal = "=0.26.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }

[dev-dependencies]
proptest = "1.11"
tokio = { workspace = true, features = ["test-util"] }
# Exercise the real client Store and rendering against Host behavior.
agent-core = { path = "../agent-core" }
# Match desktop builds even when CI tests only the headless packages. With both
# backends enabled, cold dictation must select a provider before starting TLS.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
