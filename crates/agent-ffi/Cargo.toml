[package]
name = "agent-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# iOS requests staticlib explicitly; the other consumers load a dynamic library.
crate-type = ["cdylib"]

[features]
nsh-conversation = ["dep:agent-nsh"]

[dependencies]
agent-core = { path = "../agent-core", features = ["bindings"] }

[target.'cfg(target_os = "ios")'.dependencies]
agent-nsh = { path = "../../apps/nsh", features = ["standard-text"], optional = true }
