[package]
name = "provider-adapters"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
tempfile = "3"
scopeguard = "1.2"
orchestration = { path = "../orchestration", features = ["adapter"] }
codex-app-server = { path = "../codex-app-server" }
bex-process = { path = "../bex-process" }
agent-transport = { path = "../agent-transport" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1.11"
orchestration = { path = "../orchestration", features = ["runtime"] }
