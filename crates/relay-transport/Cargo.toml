[package]
name = "relay-transport"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
host-protocol = { path = "../host-protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }
# tungstenite deliberately leaves the TLS crypto provider to its caller.
# Match the ring backend already used by the SSH transport on Mac and iOS.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# rustls-native-certs probes Unix certificate files on iOS; physical devices
# do not expose that store. Bundle public trust anchors without disabling TLS verification.
[target.'cfg(target_os = "ios")'.dependencies]
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
ring.workspace = true
