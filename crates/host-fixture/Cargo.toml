[package]
name = "host-fixture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
agent-protocol = { path = "../agent-protocol" }
agent-transport = { path = "../agent-transport" }
agent-local-host = { path = "../agent-local-host" }
anyhow.workspace = true
dunce.workspace = true
base64.workspace = true
codex-app-server = { path = "../codex-app-server" }
host-daemon = { path = "../host-daemon" }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { workspace = true, features = ["io-std", "process", "signal"] }
tokio-util.workspace = true
zeroize.workspace = true
png = "0.18.1"
tiny_http = "0.12.0"
indexmap = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
agent-core = { path = "../agent-core" }
agent-protocol = { path = "../agent-protocol", features = ["test-support"] }
rstest = { version = "0.28", default-features = false }
tempfile = "3"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-tickets = "=1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
