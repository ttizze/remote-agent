post-commit:
  commands:
    queue-quality:
      run: |
        set -eu
        umask 077
        # GUI Git clients may omit Nix from their inherited PATH.
        export PATH="$PATH:/run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:$HOME/.nix-profile/bin"
        root="$(git rev-parse --show-toplevel)"
        state="$(git rev-parse --path-format=absolute --git-common-dir)/bex-quality"
        commit="$(git rev-parse HEAD)"
        mkdir -p "$state/queue" "$state/results" "$state/logs"
        request="$(mktemp "$state/queue/.request.XXXXXX")"
        printf '%s\n%s' "$commit" "$root" > "$request"
        rm -f "$state/results/$commit.bootstrap-failed"
        mv "$request" "$state/queue/$commit.request"
        (
          # Git exports worktree-specific variables to hooks. Do not inherit
          # them into the isolated checkout used by the background worker.
          unset $(git rev-parse --local-env-vars)
          nohup sh -c '
            if nix develop "$1" --command cargo xtask quality-worker; then
              exit 0
            else
              printf "%s\n" "$?" > "$2"
            fi
          ' sh "$root" "$state/results/$commit.bootstrap-failed" \
            </dev/null >"$state/logs/$commit.bootstrap.log" 2>&1 &
        )
