# Decoding and transferring this history fills the runner's CPU and memory.
# Preserve its real request deadlines without competing with other Host tests.
[[profile.default.overrides]]
filter = 'test(=oversized_session_opens_repeatedly_and_downloads_lossless_items_without_reconnecting)'
threads-required = "num-test-threads"

# These isolation contracts copy and start private provider executables within
# ten seconds. Keep competing Host/SDK startups outside that existing budget.
[[profile.default.overrides]]
filter = 'binary(fixtures)'
threads-required = "num-test-threads"

# Resume must finish within 500 ms while history is held. Run its Host startup
# without competing provider processes and keep the actual latency assertion.
[[profile.default.overrides]]
filter = 'test(=opening_a_task_uses_cached_history_while_the_host_read_is_pending)'
threads-required = "num-test-threads"

# Sidebar updates have a three-second propagation deadline for two clients.
# Give the real Host and provider the same capacity as the other latency contracts.
[[profile.default.overrides]]
filter = 'test(=completed_conversations_refresh_the_sidebar_without_manual_reload)'
threads-required = "num-test-threads"

# Conformance cases own both provider processes; conversation cases also use
# four Tokio workers. Preserve RPC deadlines without competing Host startups.
[[profile.default.overrides]]
filter = 'binary(adapter_conformance)'
threads-required = "num-test-threads"

# This contract holds a usage request across credential verification. Reserve
# its real eight-second fetch budget instead of competing with SDK startups.
[[profile.default.overrides]]
filter = 'test(=claude_accounts_login_switch_resume_cancel_and_logout_without_codex)'
threads-required = "num-test-threads"

# The disconnected-draft contract must observe the closed transport within two
# seconds. Preserve that deadline without competing process fixtures.
[[profile.default.overrides]]
filter = 'test(=disconnected_store_keeps_editing_and_persisting_drafts)'
threads-required = "num-test-threads"

# Each corpus case opens a QUIC connection with a one-second RPC deadline and
# a three-second operation bound. Keep competing process fixtures out of that budget.
[[profile.default.overrides]]
filter = 'test(=operation_corpus)'
threads-required = "num-test-threads"

# Preparation observes five-second stage deadlines while Git creates a checkout.
# Keep competing filesystem and provider fixtures out of that budget on Windows.
[[profile.default.overrides]]
filter = 'test(=host_rpc::service::preparation::tests::preparation_publishes_worktree_setup_only_when_it_creates_a_checkout)'
threads-required = "num-test-threads"
