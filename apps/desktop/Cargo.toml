[package]
name = "bex-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
host-protocol = { path = "../../crates/host-protocol" }
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
agent-core = { path = "../../crates/agent-core" }
conversation-presentation = { path = "../../crates/conversation-presentation" }
gpui-kit = { version = "=0.6.0", features = ["tree-sitter-languages"] }
gpui-http = { package = "gpui-pre-reqwest-client", version = "0.3.4" }
gpui-wry = "=0.6.0"
wry = { package = "lb-wry", version = "0.53.3" }
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
url.workspace = true
base64.workspace = true
futures-util = { workspace = true, features = ["io"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "pnm"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
pulldown-cmark = "0.13"
async-channel = "2"
similar = { version = "2", features = ["inline"] }

[dev-dependencies]
gpui-kit = { version = "=0.6.0", features = ["test-support"] }

[[bin]]
name = "bex-desktop"
path = "src/main.rs"
