[package]
name = "bex-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-protocol = { path = "../../crates/agent-protocol" }
agent-transport = { path = "../../crates/agent-transport" }
tracing.workspace = true
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["rt"] }
agent-core = { path = "../../crates/agent-core", features = ["diagrams"] }
host-daemon = { path = "../../crates/host-daemon" }
directories = "6"
rfd = "0.17.2"
gpui-kit = { version = "=0.6.0", features = ["tree-sitter-languages"] }
# Keep GPUI icons inside development bundles as well as release bundles.
rust-embed = { version = "8.12", features = ["debug-embed"] }
gpui-http = { package = "gpui-pre-reqwest-client", version = "0.3.4" }
gpui-wry = "=0.6.0"
wry = { package = "lb-wry", version = "0.53.3" }
uuid = { version = "1", features = ["v4"] }
serde_json.workspace = true
url.workspace = true
base64.workspace = true
futures-util = { workspace = true, features = ["io"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "pnm"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
async-channel = "2"
similar = { version = "2", features = ["inline"] }
alacritty_terminal = "=0.26.0"
cpal = "0.18.2"
rubato = { version = "5", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
security-framework = "3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSCell", "NSControl", "NSResponder", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSGraphics"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSHTTPCookie", "NSDictionary", "NSString", "NSDate"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "WKHTTPCookieStore", "WKWebsiteDataStore", "WKWebView", "WKWebViewConfiguration"] }
block2 = "0.6"

[dev-dependencies]
gpui-kit = { version = "=0.6.0", features = ["test-support"] }
proptest = "1.11"

[[bin]]
name = "bex-desktop"
path = "src/main.rs"

[[test]]
name = "chrome_cookie_webview"
path = "tests/chrome_cookie_webview.rs"
harness = false
