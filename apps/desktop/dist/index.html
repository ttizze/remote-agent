<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex Remote</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <div id="app" class="app-shell" data-connection="connecting" data-sidebar="open" data-review="open">
      <aside id="app-sidebar" class="sidebar">
        <header class="sidebar-header">
          <button class="workspace-switcher" type="button">Codex <span aria-hidden="true">⌄</span></button>
          <div class="sidebar-header-actions">
            <button id="refresh-button" class="icon-button" type="button" aria-label="検索と再読み込み" title="再読み込み">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></svg>
            </button>
            <button class="icon-button" type="button" aria-label="通知">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5zM10 19h4" /></svg>
            </button>
            <span id="connection-dot" class="connection-dot" title="Codexに接続中"></span>
          </div>
        </header>

        <nav class="primary-nav" aria-label="Codex">
          <button id="new-task-button" type="button"><span class="nav-icon new-chat-icon" aria-hidden="true"></span><span>新しいチャット</span></button>
          <button type="button"><span class="nav-icon pull-request-icon" aria-hidden="true"></span><span>プルリクエスト</span></button>
          <button type="button"><span class="nav-icon sites-icon" aria-hidden="true"></span><span>サイト</span></button>
          <button type="button"><span class="nav-icon schedule-icon" aria-hidden="true"></span><span>スケジュール</span></button>
          <button type="button"><span class="nav-icon plugins-icon" aria-hidden="true"></span><span>プラグイン</span></button>
          <button type="button"><span class="nav-icon security-icon" aria-hidden="true"></span><span>セキュリティ</span></button>
        </nav>

        <label class="search-box sidebar-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="m16 16 4 4" /></svg>
          <input id="thread-search" type="search" placeholder="チャットを検索" autocomplete="off" />
          <kbd>⌘K</kbd>
        </label>

        <p class="sidebar-section-label">プロジェクト</p>
        <div id="sidebar-state" class="sidebar-state">
          <span class="spinner"></span>
          <span>Codexを起動しています</span>
        </div>
        <nav id="project-list" class="project-list" aria-label="プロジェクトとチャット"></nav>

        <footer class="sidebar-footer">
          <div class="avatar">You</div>
          <div class="account-copy">
            <strong>Local workspace</strong>
            <span id="platform-label">接続中…</span>
          </div>
        </footer>
      </aside>

      <main class="workspace">
        <header id="conversation-header" class="conversation-header is-empty">
          <button id="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-label="サイドバーを閉じる" aria-controls="app-sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM9 5v14" /></svg>
          </button>
          <div class="thread-heading">
            <span id="thread-project" class="thread-project">Remote Agent</span>
            <h2 id="thread-title">タスクを選択してください</h2>
          </div>
          <div class="header-actions">
            <span id="thread-status" class="thread-status">待機中</span>
            <button id="review-toggle" class="icon-button" type="button" aria-label="変更レビューを閉じる" aria-controls="review-pane" aria-expanded="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5zM14 5v14M8 9h3M8 13h3" /></svg>
            </button>
            <button id="header-new-task" class="icon-button" type="button" aria-label="新しいチャット">＋</button>
          </div>
        </header>

        <section id="empty-state" class="empty-state">
          <div class="empty-orb">
            <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M12 27 20 8l8 19-8-4z" /><circle cx="20" cy="20" r="17" /></svg>
          </div>
          <h2>今日は何を作りますか？</h2>
          <p>既存のタスクを開くか、新しいタスクを始めてください。</p>
          <button id="empty-new-task" class="primary-button" type="button">新しいタスク</button>
        </section>

        <section id="conversation" class="conversation" aria-live="polite" hidden>
          <div id="messages" class="messages"></div>
          <div id="scroll-anchor"></div>
        </section>

        <footer id="composer" class="composer" hidden>
          <form id="composer-form" class="composer-card">
            <textarea id="message-input" rows="1" placeholder="Codexにメッセージを送る" aria-label="メッセージ"></textarea>
            <div class="composer-toolbar">
              <div class="composer-context">
                <button class="composer-control attach-control" type="button" aria-label="ファイルを添付">＋</button>
                <button class="composer-control permission-control" type="button" aria-label="権限を変更"><span aria-hidden="true">⬡</span><span>フルアクセス</span><span aria-hidden="true">⌄</span></button>
                <button class="composer-control environment-control" type="button" aria-label="実行環境を変更"><span aria-hidden="true">▣</span><span>ローカル</span><span aria-hidden="true">⌄</span></button>
                <span id="composer-cwd" class="composer-cwd">workspace</span>
              </div>
              <div class="composer-actions">
                <button class="composer-control model-control" type="button" aria-label="モデルと推論レベルを変更"><span aria-hidden="true">ϟ</span><span>5.6 Sol 高</span><span aria-hidden="true">⌄</span></button>
                <button class="composer-control voice-control" type="button" aria-label="音声入力"><span aria-hidden="true">♩</span></button>
                <button id="stop-button" class="stop-button" type="button" hidden aria-label="停止">
                  <span></span>
                </button>
                <button id="send-button" class="send-button" type="submit" aria-label="送信">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
                </button>
              </div>
            </div>
          </form>
          <p>Codexは間違えることがあります。変更内容を確認してください。</p>
        </footer>
      </main>

      <aside id="review-pane" class="review-pane" aria-label="変更レビュー">
        <header class="review-header">
          <strong>変更</strong>
          <span class="diff-stat"><span id="review-additions" class="additions">+0</span> <span id="review-deletions" class="deletions">-0</span></span>
        </header>
        <button class="review-row" type="button"><span>▣</span><span>ローカル</span><span>⌄</span></button>
        <button class="review-row" type="button"><span>⑂</span><span id="review-branch">main</span><span>⌄</span></button>
        <button class="review-row" type="button"><span>●</span><span>コミットまたはプッシュ</span></button>
        <button class="review-row" type="button"><span>◉</span><span>ブランチを比較</span><span>↗</span></button>
        <div id="review-files" class="review-files">
          <p>チャットを開くとリポジトリの変更を表示します。</p>
        </div>
      </aside>
    </div>

    <dialog id="new-task-dialog" class="task-dialog">
      <form id="new-task-form" method="dialog">
        <header>
          <div>
            <p class="eyebrow">NEW TASK</p>
            <h2>Codexに作業を依頼</h2>
          </div>
          <button id="close-dialog" class="icon-button" type="button" aria-label="閉じる">×</button>
        </header>
        <label>
          プロジェクト
          <select id="new-task-project"></select>
        </label>
        <label>
          作業ディレクトリ
          <input id="new-task-cwd" list="cwd-options" placeholder="/path/to/project" required />
          <datalist id="cwd-options"></datalist>
        </label>
        <label>
          最初のメッセージ
          <textarea id="new-task-prompt" rows="6" placeholder="実装したいこと、直したいことを説明してください" required></textarea>
        </label>
        <p id="new-task-error" class="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="cancel-new-task" class="secondary-button" type="button">キャンセル</button>
          <button id="create-task-button" class="primary-button" type="submit">タスクを開始</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
