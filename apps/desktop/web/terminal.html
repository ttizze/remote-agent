<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<style>/*XTERM_CSS*/</style>
<style>html,body{height:100%;margin:0;background:#181818;overflow:hidden}#terminal{box-sizing:border-box;width:100%;height:100%;padding:10px}.xterm{height:100%}</style>
</head><body><div id="terminal" aria-label="ターミナル"></div>
<script>/*XTERM_JS*/</script><script>/*FIT_JS*/</script>
<script>
const terminal = new Terminal({fontFamily:'Menlo, monospace',fontSize:13,lineHeight:1.25,cursorBlink:true,scrollback:10000,theme:{background:'#181818',foreground:'#e5e5e5',cursor:'#eeeeee',selectionBackground:'#55555588'}});
const fit = new FitAddon.FitAddon();
const post = value => window.ipc.postMessage(JSON.stringify(value));
terminal.loadAddon(fit);
terminal.open(document.getElementById('terminal'));
terminal.onData(data => post({type:'input',data}));
terminal.onResize(({cols,rows}) => post({type:'resize',cols,rows}));
terminal.attachCustomKeyEventHandler(event => {
  if(event.type==='keydown' && event.metaKey && event.key.toLowerCase()==='c' && terminal.hasSelection()) {
    post({type:'copy',data:terminal.getSelection()}); event.preventDefault(); return false;
  }
  if(event.type==='keydown' && event.metaKey && event.key.toLowerCase()==='v') {
    post({type:'paste'}); event.preventDefault(); return false;
  }
  return true;
});
window.bexTerminal = {
  write(base64, sequence) {terminal.write(Uint8Array.from(atob(base64), c => c.charCodeAt(0)), () => post({type:'acknowledge',sequence}));},
  status(message) {terminal.writeln('\r\n\x1b[90m'+message+'\x1b[0m');},
  paste(text) {terminal.paste(text);},
  focus() {terminal.focus();}
};
new ResizeObserver(() => fit.fit()).observe(document.body);
fit.fit();
post({type:'ready',cols:terminal.cols,rows:terminal.rows});
</script></body></html>
