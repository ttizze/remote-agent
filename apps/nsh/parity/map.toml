# ── Approved deviations ─────────────────────────────────────────────────────
# Differences the user approved: the report lists them as approved, not as
# differences. An approval names an `element` or a `group` (the elements whose
# `group` it is); `metrics` (the report's names) narrow it, all when omitted.
# The composer group is the input field, its footer, controls and chips and
# the model picker's popup, in every state; the approval and question panels
# above it, and the question's submit button, are still compared.
# The others are what the user's decisions and the fixture fix, not the
# clients' layout.

[[approved]]
group = "composer"
reason = "composer keeps Bex's own design"
approved = "2026-11-08"
by = "the user"

# The live rows' shimmer: NSH sweeps T3 Code's band (4.5rem of the foreground
# over the muted label, 2.2 s in 30 steps) by recolouring the label's spans
# on a timer (`apps/nsh/src/shimmer.rs`), which the capture cannot list as a
# Core Animation; where the band is when each side is captured decides the
# strongest colour measured.
[[approved]]
group = "live"
metrics = ["animation", "text or glyph colour", "size"]
reason = "a measurement artefact: the same band swept on a timer, not a layer animation, its colour at capture set by the band's phase (where it hides the ink, only the boxes compare)"
approved = "2026-11-09"
by = "the coordinator"

