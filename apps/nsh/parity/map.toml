# The states `cargo xtask nsh-parity` brings NSH and T3 Code to, and the
# elements it pairs in each. The step language of `nsh` is the acceptance
# scenarios' (`apps/nsh/src/acceptance/script.rs`) plus `send <text>`; `t3`
# steps are `scripts/nsh-parity-t3.ts`'s. Prompts carry the Codex fixture's
# scenario tags (`crates/host-fixture/src/fixture/scenario.rs`), so both
# clients show the same turn. T3 selectors are written from a run's
# `<state>/t3-outline.txt`, NSH matchers from its `<state>/nsh.json`.
# `apps/nsh/parity/states.md` lists every state of T3's conversation screen
# and which of them this map covers.

[viewport]
width = 1280
height = 800

[tolerance]
position = 4
size = 4
text = 1
color = 24
radius = 2

# ── Conversation ────────────────────────────────────────────────────────────

[[state]]
name = "draft"
screen = "Conversation"
description = "A new chat in the project before anything is sent: the hero and the empty composer."
nsh = ["press \"New chat in this project\"", "expect \"Ask AI\""]
t3 = []
column = "composer"
elements = ["window", "header", "header-project", "header-new-chat", "composer", "composer-placeholder", "composer-send", "composer-attach", "composer-model", "composer-dictation", "draft-hero", "draft-hero-project", "draft-without-project"]

[[state]]
name = "composer-draft"
screen = "Conversation"
description = "A new chat with three lines typed: the composer grows and the send button turns on."
nsh = ["press \"New chat in this project\"", "type \"Ask AI\" 一行目", "key shift+return", "type \"Ask AI\" 二行目", "key shift+return", "type \"Ask AI\" 三行目"]
t3 = [{ type = "一行目" }, { key = "Shift+Enter" }, { type = "二行目" }, { key = "Shift+Enter" }, { type = "三行目" }]
column = "composer"
elements = ["composer", "composer-overlay", "composer-text", "composer-send"]

[[state]]
name = "model-picker"
screen = "Conversation"
description = "The composer's model picker open."
nsh = ["press \"New chat in this project\"", "press \"Fixture Model\"", "press \"Change approval mode\"", "press \"Full access\"", "wait 800"]
t3 = [{ click = "[data-chat-provider-model-picker]" }, { waitMs = 800 }]
column = "composer"
elements = ["composer", "composer-overlay", "composer-model", "model-menu", "model-menu-row", "model-effort", "model-permissions"]

[[state]]
name = "turn-thinking"
screen = "Conversation"
description = "A running turn before any work or text arrives: T3 shows its working header and a Thinking row with a moving highlight."
nsh = ["send [delayed-input] 考える様子を確認します", "expect \"考える様子を確認します\" 20000", "wait 1500"]
t3 = [{ send = "[delayed-input] 考える様子を確認します" }, { waitFor = "[data-timeline-row-kind=thinking]" }]
column = "composer"
elements = ["composer", "composer-overlay", "window", "header", "header-project", "header-title", "user-bubble", "user-text", "working-header", "thinking-row", "composer-stop"]

[[state]]
name = "turn-live"
screen = "Conversation"
description = "A running turn with a command in flight: the working header and the live activity row with its shimmer."
nsh = ["send [groups] ライブの作業を確認します", "expect \"最初の確認が終わりました。次のコマンドを確認します。\" 20000"]
t3 = [{ send = "[groups] ライブの作業を確認します" }, { waitText = "Running pwd" }]
column = "composer"
elements = ["composer", "composer-overlay", "window", "header", "header-project", "header-title", "user-bubble", "user-text", "working-header", "live-row", "live-row-icon", "live-commentary", "live-done-group", "composer-stop", "changed-files-card"]

[[state]]
name = "turn-finished"
screen = "Conversation"
description = "A finished turn: the user's message, the folded work row, the answer and its actions."
nsh = ["send [groups] 完了した作業を確認します", "expect \"最初の確認が終わりました。次のコマンドを確認します。\" 20000", "fixture /release-inputs", "expect \"シミュレータで完了しました。\" 30000"]
t3 = [{ send = "[groups] 完了した作業を確認します" }, { waitText = "Running pwd" }, { release = true }, { waitText = "シミュレータで完了しました。" }, { waitMs = 1500 }]
column = "composer"
absent = ["user-copy", "user-edit", "user-time", "assistant-copy", "assistant-fork", "assistant-time"]
elements = ["composer", "composer-overlay", "composer-send", "window", "header", "header-project", "header-title", "header-details-toggle", "header-terminal-toggle", "header-panel-toggle", "user-bubble", "user-text", "user-copy", "user-edit", "user-time", "work-toggle", "assistant-text", "assistant-copy", "assistant-fork", "assistant-time", "changed-files-card"]

[[state]]
name = "turn-hover"
screen = "Conversation"
description = "The pointer over the user's message: its hover-only actions."
nsh = ["send [immediate] ホバーを確認します", "expect \"シミュレータで完了しました。\" 30000", "hover \"message.user-text\""]
t3 = [{ send = "[immediate] ホバーを確認します" }, { waitText = "シミュレータで完了しました。" }, { waitMs = 1500 }, { hover = "[data-message-role=user] [data-user-message-body]" }]
column = "composer"
elements = ["composer", "composer-overlay", "user-bubble", "user-copy", "user-edit", "user-time"]

[[state]]
name = "turn-expanded"
screen = "Conversation"
description = "The finished turn's work expanded down to its tool rows and commentary."
nsh = ["send [groups] 展開した作業を確認します", "expect \"最初の確認が終わりました。次のコマンドを確認します。\" 20000", "fixture /release-inputs", "expect \"シミュレータで完了しました。\" 30000", "press \"Worked for*\"", "press \"Ran 1 command\"", "expect \"./gradlew test\""]
t3 = [{ send = "[groups] 展開した作業を確認します" }, { waitText = "Running pwd" }, { release = true }, { waitText = "シミュレータで完了しました。" }, { click = "[data-timeline-row-kind=turn-fold] button" }, { click = "[data-timeline-row-kind=work-toggle] button" }, { waitText = "./gradlew test" }]
column = "composer"
elements = ["composer", "composer-overlay", "user-bubble", "work-toggle", "work-group-toggle", "tool-row", "tool-row-icon", "commentary-text", "assistant-text", "scroll-to-bottom"]

[[state]]
name = "turn-items"
screen = "Conversation"
description = "A finished turn whose work holds every Codex item kind the fixture sends (plan, MCP, dynamic and agent tools, web search, image view, compaction, review mode), expanded."
nsh = ["send [items] [immediate] 項目を確認します", "expect \"シミュレータで完了しました。\" 30000", "press \"Worked for*\"", "wait 800"]
t3 = [{ send = "[items] [immediate] 項目を確認します" }, { waitText = "シミュレータで完了しました。" }, { click = "[data-timeline-row-kind=turn-fold] button" }, { waitMs = 800 }]
column = "composer"
elements = ["composer", "composer-overlay", "work-toggle", "work-group-toggle", "tool-row", "web-search-row", "plan-row"]

[[state]]
name = "turn-failed"
screen = "Conversation"
description = "A turn that failed: its work and the error in the timeline, and T3's error banner."
nsh = ["send [failed] 失敗を確認します", "expect \"context is full\" 20000"]
t3 = [{ send = "[failed] 失敗を確認します" }, { waitText = "Provider error" }]
column = "composer"
elements = ["composer", "composer-overlay", "window", "header", "user-bubble", "error-banner", "error-title", "error-detail", "error-copy", "tool-row"]

[[state]]
name = "turn-interrupted"
screen = "Conversation"
description = "A turn the provider interrupted."
nsh = ["send [interrupted] 中断を確認します", "wait 4000"]
t3 = [{ send = "[interrupted] 中断を確認します" }, { waitMs = 4000 }]
column = "composer"
elements = ["composer", "composer-overlay", "user-bubble", "work-toggle", "interrupted-row"]

[[state]]
name = "turn-retry"
screen = "Conversation"
description = "A stream that disconnected and is being retried."
nsh = ["send [retry] 再接続を確認します", "expect \"再接続を確認します\" 20000", "wait 300"]
t3 = [{ send = "[retry] 再接続を確認します" }, { waitText = "Retrying" }]
column = "composer"
elements = ["composer", "composer-overlay", "working-header", "retry-notice"]

[[state]]
name = "approval"
screen = "Conversation"
description = "A command waiting for approval: T3 Code asks in the work row, Bex above the composer."
nsh = ["send [approval] 承認を確認します", "expect \"結合テストの承認確認\" 20000"]
t3 = [{ send = "[approval] 承認を確認します" }, { waitText = "Waiting for approval" }]
column = "composer"
elements = ["composer", "composer-overlay", "approval-panel", "approval-title", "approval-command", "approval-accept", "approval-decline", "working-header", "approval-live-row"]

[[state]]
name = "question"
screen = "Conversation"
description = "A question from the agent: its options above the composer."
nsh = ["send [request] 質問を確認します", "expect \"このまま続けますか？\" 20000"]
t3 = [{ send = "[request] 質問を確認します" }, { waitText = "このまま続けますか？" }]
column = "composer"
elements = ["composer", "composer-overlay", "user-bubble", "question-panel", "question-header", "question-text", "question-option", "question-option-detail", "question-dismiss", "question-submit", "composer-placeholder", "working-header", "question-live-row"]

[[state]]
name = "markdown-document"
screen = "Conversation"
description = "A Markdown answer: heading, emphasis, quote, lists, tasks, a code block and an image that cannot load."
nsh = ["send [markdown-document] [immediate] 文書を確認します", "expect \"見出し\" 30000", "wait 1500"]
t3 = [{ send = "[markdown-document] [immediate] 文書を確認します" }, { waitText = "見出し" }]
column = "composer"
absent = ["assistant-copy"]
elements = ["composer", "composer-overlay", "markdown-body", "markdown-code", "markdown-code-language", "markdown-code-copy", "markdown-image-error", "assistant-copy"]

[[state]]
name = "markdown-table"
screen = "Conversation"
description = "A Markdown table in an answer."
nsh = ["send [markdown-table] [immediate] 表を確認します", "expect \"構成\" 30000", "wait 1500"]
t3 = [{ send = "[markdown-table] [immediate] 表を確認します" }, { waitText = "構成" }]
column = "composer"
elements = ["composer", "composer-overlay", "markdown-table", "markdown-table-header"]

[[state]]
name = "images"
screen = "Conversation"
description = "An answer with a Host image and an inline image, and the user's attached image."
nsh = ["send [images] [immediate] 画像を確認します", "expect \"インライン画像です。\" 30000", "wait 1500"]
t3 = [{ send = "[images] [immediate] 画像を確認します" }, { waitText = "インライン画像です。" }, { waitMs = 1500 }]
column = "composer"
elements = ["composer", "composer-overlay", "assistant-image"]

[[state]]
name = "changed-files"
screen = "Conversation"
description = "A finished turn that edited files: how each client shows the changes."
nsh = ["send [workspace-edit] 編集を確認します", "wait 4000", "fixture /release-inputs", "expect \"シミュレータで完了しました。\" 30000"]
t3 = [{ send = "[workspace-edit] 編集を確認します" }, { waitText = "Working for" }, { waitMs = 3000 }, { release = true }, { waitText = "シミュレータで完了しました。" }]
column = "composer"
elements = ["composer", "composer-overlay", "assistant-text", "changed-files-card"]

[[state]]
name = "history-minimap"
screen = "Conversation"
description = "Three finished turns: the minimap in the timeline's side gutter."
nsh = ["send [immediate] 一つ目を確認します", "expect \"シミュレータで完了しました。\" 30000", "send [immediate] 二つ目を確認します", "expect \"二つ目を確認します\" 30000", "wait 2500", "send [immediate] 三つ目を確認します", "expect \"三つ目を確認します\" 30000", "wait 2500"]
t3 = [{ send = "[immediate] 一つ目を確認します" }, { waitText = "シミュレータで完了しました。" }, { send = "[immediate] 二つ目を確認します" }, { waitMs = 2500 }, { send = "[immediate] 三つ目を確認します" }, { waitMs = 2500 }]
column = "composer"
elements = ["composer", "composer-overlay", "minimap", "minimap-strip", "user-bubble", "timeline-gutter-text"]

# ── Thread details ────────────────────────────────────────────────────────

[[state]]
name = "details-inline"
screen = "Thread details"
description = "The details card beside a conversation: its surface, editor and changes row."
nsh = ["send [immediate] 詳細を確認します", "expect \"シミュレータで完了しました。\" 30000"]
t3 = [{ send = "[immediate] 詳細を確認します" }, { waitText = "シミュレータで完了しました。" }]
elements = ["details-card", "details-editor", "details-changes"]

[[state]]
name = "details-popover"
screen = "Thread details"
description = "The same details card opened from the header while the right panel occupies its space."
nsh = ["send [immediate] 詳細を確認します", "expect \"シミュレータで完了しました。\" 30000", "press \"Toggle right panel\"", "press \"Toggle thread details\"", "expect Sources"]
t3 = [{ send = "[immediate] 詳細を確認します" }, { waitText = "シミュレータで完了しました。" }, { click = "button[aria-label='Toggle right panel']" }, { click = "button[aria-label='Toggle thread details panel']" }, { waitFor = "[data-thread-details-panel=popover]" }]
elements = ["details-card", "details-editor", "details-changes"]

# ── Sidebar (compared with the GPUI client) ─────────────────────────────────

[[state]]
name = "sidebar"
screen = "Sidebar"
description = "The sidebar beside a chat: its frame, project row and settings button, against the GPUI client's layout."
reference = "gpui"
nsh = ["send [immediate] サイドバーを確認します", "expect \"シミュレータで完了しました。\" 30000"]
elements = ["sidebar", "sidebar-project-row", "sidebar-project-icon", "sidebar-settings"]

[[state]]
name = "sidebar-header"
screen = "Sidebar"
description = "The search field and project filter, add-project and new-thread controls follow T3 Code's sidebar header."
nsh = []
t3 = []
elements = ["sidebar-search-field", "sidebar-search-text", "sidebar-search-icon", "sidebar-project-filter", "sidebar-add-project", "sidebar-new-chat"]

# ── Elements ────────────────────────────────────────────────────────────────
# `nsh = {}`: NSH draws no counterpart, so the element is reported missing.

[[element]]
id = "composer"
what = "Composer surface"
kind = "box"
group = "composer"
t3 = "[data-chat-composer-surface]"
# The input surface stays present when its model picker opens.
nsh = { text = "Message", role = "AXGroup" }

[[element]]
id = "composer-overlay"
what = "Composer overlay (what lies over the timeline's end)"
kind = "box"
group = "composer"
t3 = "[data-chat-composer-overlay=true]"
# The view over the timeline holding the composer and what stands on it.
nsh = { text = "Message", role = "AXGroup", up = 2 }

[[element]]
id = "composer-placeholder"
what = "Composer placeholder"
kind = "text"
group = "composer"
t3 = "[data-chat-composer-body] div:has(> [data-testid=composer-editor]) + div"
nsh = { contains = "", class = "NSTextField" }
anchor = "composer"

[[element]]
id = "composer-text"
what = "Typed draft"
kind = "text"
group = "composer"
t3 = "[data-testid=composer-editor]"
nsh = { class = "NshTextView" }
anchor = "composer"

[[element]]
id = "composer-send"
what = "Send button"
kind = "icon"
group = "composer"
t3 = "button[aria-label='Submit message']"
nsh = { text = "Send" }
anchor = "composer"

[[element]]
id = "composer-stop"
what = "Stop button"
kind = "icon"
group = "composer"
t3 = "button[aria-label='Stop generation']"
nsh = { text = "Stop" }
anchor = "composer"

[[element]]
id = "composer-attach"
what = "Attach button"
kind = "icon"
group = "composer"
t3 = "button[aria-label='Attach files']"
nsh = { text = "Attach file" }
anchor = "composer"

[[element]]
id = "composer-dictation"
what = "Dictation button"
kind = "icon"
group = "composer"
t3 = "button[aria-label*='ictat'], button[aria-label*='microphone' i]"
nsh = { text = "Transcribe audio with Codex" }
anchor = "composer"

[[element]]
id = "composer-model"
what = "Model picker"
kind = "text"
group = "composer"
t3 = "[data-chat-provider-model-picker]"
nsh = { text = "Fixture Model", role = "AXButton" }
anchor = "composer"

[[element]]
id = "model-menu"
what = "Model picker popup"
kind = "box"
group = "model-picker"
t3 = "[data-slot=popover-popup]"
nsh = { text = "Search models", up = "background" }
anchor = "composer-model"
from_end = true

[[element]]
id = "model-menu-row"
what = "Model picker: the model's row"
kind = "text"
group = "model-picker"
t3 = "[data-model-picker-content] [role=option] .truncate.text-sm"
nsh = { text = "Fixture Model", role = "AXStaticText", nth = 1 }
anchor = "model-menu"

[[element]]
id = "model-effort"
what = "The model picker's reasoning levels"
kind = "box"
group = "model-picker"
t3 = "[data-model-picker-effort]"
nsh = { text = "Reasoning depth", up = 2 }
anchor = "model-menu"

[[element]]
id = "model-permissions"
what = "Permissions in the model picker's footer"
kind = "text"
group = "model-picker"
t3 = "[data-slot=popover-popup] [data-composer-permissions-trigger]"
nsh = { text = "Change approval mode", role = "AXButton" }
anchor = "model-menu"

[[element]]
id = "draft-hero"
what = "New chat heading"
kind = "text"
t3 = "main h1"
# The whole heading, its project choice included, as T3 Code's `h1`.
nsh = { contains = "What should", role = "AXStaticText", up = 1 }

[[element]]
id = "draft-hero-project"
what = "New chat heading: project choice"
kind = "text"
t3 = "main h1 button"
nsh = { text = "Choose project" }

[[element]]
id = "draft-without-project"
what = "Start without a project"
kind = "text"
t3 = "main h1 + p button"
nsh = { text = "or start without a project" }

# What the window's own edges place (the header's toggles at its end) is
# measured from the window.
[[element]]
id = "window"
what = "Window"
kind = "box"
t3 = "body"
nsh = { class = "NSView" }
anchor = "window"

[[element]]
id = "header"
what = "Header bar"
kind = "box"
t3 = "header[data-chat-header]"
nsh = { text = "Toggle terminal drawer", up = 3 }
anchor = "window"

[[element]]
id = "header-project"
what = "Header: project"
kind = "text"
t3 = "header nav li:first-child [data-slot=workspace-breadcrumb-text]"
nsh = { text = "検証プロジェクト", role = "AXStaticText", nth = 1 }
anchor = "header"

[[element]]
id = "header-new-chat"
what = "Header: new chat title"
kind = "text"
t3 = "header h2 [data-slot=workspace-breadcrumb-text]"
nsh = { text = "New chat", role = "AXStaticText" }
anchor = "header"

[[element]]
id = "header-title"
what = "Header: chat title"
kind = "text"
t3 = "header h2 [data-slot=workspace-breadcrumb-text]"
nsh = { text = "Simulator conversation", role = "AXStaticText" }
anchor = "header"

[[element]]
id = "header-details-toggle"
what = "Header: details panel toggle"
kind = "icon"
t3 = "button[aria-label='Toggle thread details panel']"
nsh = { text = "Toggle thread details" }
anchor = "window"

[[element]]
id = "header-terminal-toggle"
what = "Header: terminal toggle"
kind = "icon"
t3 = "button[aria-label='Toggle terminal drawer']"
nsh = { text = "Toggle terminal drawer" }
anchor = "window"

[[element]]
id = "header-panel-toggle"
what = "Header: right panel toggle"
kind = "icon"
t3 = "button[aria-label='Toggle right panel']"
nsh = { text = "Toggle right panel" }
anchor = "window"

[[element]]
id = "user-bubble"
what = "User message bubble"
kind = "box"
# At the column's end, as T3 Code's: the sidebar keeps the GPUI client's width,
# so the columns differ in width.
from_end = true
t3 = "[data-message-role=user] .bg-message"
nsh = { text = "conversation.user-bubble", role = "AXGroup" }

[[element]]
id = "user-text"
what = "User message text"
kind = "text"
from_end = true
t3 = "[data-message-role=user] [data-user-message-body]"
nsh = { text = "message.user-text" }

[[element]]
id = "user-copy"
what = "User message: copy"
kind = "icon"
from_end = true
t3 = "[data-message-role=user] button[aria-label='Copy message']"
nsh = { text = "conversation.user-copy", role = "AXButton" }

[[element]]
id = "user-edit"
what = "User message: edit"
kind = "icon"
from_end = true
t3 = "[data-message-role=user] button[aria-label='Edit from here']"
nsh = { text = "conversation.user-edit", role = "AXButton" }

[[element]]
id = "user-time"
what = "User message time"
kind = "text"
from_end = true
t3 = "[data-message-role=user] p.tabular-nums"
nsh = { text = "conversation.user-time", role = "AXStaticText" }

[[element]]
id = "work-toggle"
what = "Folded work row (Worked for …)"
kind = "text"
t3 = "[data-timeline-row-kind=turn-fold] button span"
nsh = { text = "conversation.assistant-fold", role = "AXButton" }

[[element]]
id = "work-group-toggle"
what = "Work group toggle (Ran … commands)"
kind = "text"
t3 = "[data-timeline-row-kind=work-toggle] .truncate"
nsh = { contains = "Ran ", role = "AXStaticText" }

[[element]]
id = "assistant-text"
what = "Answer text"
kind = "text"
# The answer, which carries its actions below (`pb-4`), not commentary.
t3 = "[data-timeline-row-kind=message][data-message-role=assistant].pb-4 .chat-markdown"
nsh = { text = "シミュレータで完了しました。" }

[[element]]
id = "assistant-copy"
what = "Answer: copy"
kind = "icon"
t3 = "[data-message-role=assistant] button[aria-label='Copy message']"
nsh = { text = "conversation.assistant-copy", role = "AXButton" }

[[element]]
id = "assistant-fork"
what = "Answer: fork"
kind = "icon"
t3 = "[data-message-role=assistant] button[aria-label='Fork from this response']"
nsh = { text = "conversation.assistant-fork", role = "AXButton" }

[[element]]
id = "assistant-time"
what = "Answer time"
kind = "text"
t3 = "[data-message-role=assistant] p.tabular-nums"
nsh = { text = "conversation.assistant-time", role = "AXStaticText" }

[[element]]
id = "working-header"
what = "Working header (Working for …)"
kind = "text"
t3 = "[data-timeline-row-kind=working] span.relative"
nsh = { contains = "Working for" }

[[element]]
id = "thinking-row"
what = "Thinking row"
kind = "text"
group = "live"
t3 = "[data-timeline-row-kind=thinking] .truncate"
nsh = { contains = "Thinking" }

[[element]]
id = "live-row"
what = "Live activity row (running tool or request)"
kind = "text"
group = "live"
t3 = "[data-timeline-row-kind=work-live] .truncate"
nsh = { contains = "Running", role = "AXStaticText" }

[[element]]
id = "approval-live-row"
what = "Live activity row: the approval it waits for"
kind = "text"
group = "live"
