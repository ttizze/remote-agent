[package]
name = "agent-nsh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-core = { path = "../../crates/agent-core", features = ["bindings", "diagrams"] }
agent-local-host = { path = "../../crates/agent-local-host" }
agent-protocol = { path = "../../crates/agent-protocol" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process"] }
tokio-util = { workspace = true, features = ["rt"] }
async-channel = "2"
uuid = { version = "1", features = ["v4", "v5"] }
tempfile = "3"
url.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Lucide's own SVG files, independent of any UI framework.
lucide-static-svg = "=1.70.0"
# v0.4.0: the published iOS crate references the Mac crate's speech.rs,
# which is absent from its crates.io archive. The repository keeps it, as does the
# fork ttizze/nsh: v0.4.0 with Bex's fixes, pinned on the retained
# fix/bex-follow-end-shrink-pinned branch.
nsh-core = { git = "https://github.com/ttizze/nsh", rev = "56741e2fba707427cd0dcc7be3e6391c4cccf67b" }
nsh-base = { git = "https://github.com/ttizze/nsh", rev = "56741e2fba707427cd0dcc7be3e6391c4cccf67b", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
native-browser = { path = "../native-browser" }
nsh-platform-macos = { git = "https://github.com/ttizze/nsh", rev = "56741e2fba707427cd0dcc7be3e6391c4cccf67b", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPopUpButton", "NSPopUpButtonCell", "NSMenuItemCell", "NSButtonCell", "NSActionCell", "NSCell", "NSSearchField", "NSSwitch", "NSProgressIndicator", "NSToolbarItem", "NSTextField", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSSavePanel", "NSPasteboard", "NSPasteboardItem", "NSFontDescriptor", "NSAccessibilityProtocols", "NSApplication", "NSApplicationScripting", "block2", "NSBitmapImageRep", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImageRep", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-quick-look-ui = { version = "=0.3.2", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewPanel", "objc2-app-kit"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { git = "https://github.com/ttizze/nsh", rev = "56741e2fba707427cd0dcc7be3e6391c4cccf67b", default-features = false }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-core-foundation = "=0.3.2"
objc2-ui-kit = { version = "=0.3.2", features = ["objc2-uniform-type-identifiers"] }

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
libloading = "=0.8.9"
security-framework = "=3.7.0"
block2 = "=0.6.2"
objc2-uniform-type-identifiers = "=0.3.2"
objc2-avf-audio = { version = "=0.3.2", default-features = false, features = ["std", "block2", "AVAudioApplication", "AVAudioRecorder", "AVAudioFormat", "AVAudioTypes", "AVAudioFile", "AVAudioBuffer", "AVAudioSession", "AVAudioSessionTypes"] }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { git = "https://github.com/ttizze/nsh", rev = "56741e2fba707427cd0dcc7be3e6391c4cccf67b", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
# The microphone, through WASAPI.
cpal = "0.18.2"

# The Host streams a terminal's bytes; off Apple platforms, which hand them to
# SwiftTerm, the app emulates and draws the screen itself.
[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
alacritty_terminal = "=0.26.0"

[build-dependencies]
base64.workspace = true
resvg = { version = "=0.46.0", default-features = false }

[dev-dependencies]
alacritty_terminal = "=0.26.0"

# Desktop update flow; the iPhone app is updated by its store. The desktop
# shows its Host's invitation as a QR code for phones.
[target.'cfg(not(target_os = "ios"))'.dependencies]
agent-core = { path = "../../crates/agent-core", features = ["app-updates"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# The desktop's diagnostic log.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
agent-transport = { path = "../../crates/agent-transport" }
tracing.workspace = true
