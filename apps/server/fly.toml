app = "bex-relay-ttizze"
primary_region = "nrt"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "bex-relay-ttizze.fly.dev"
  PHX_SERVER = "true"
  PHX_BIND_IP = "0.0.0.0"
  PORT = "4000"

# Routes currently live in one BEAM process. Deploy with --ha=false and
# --strategy immediate so a rolling replacement cannot split the two peers.
[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
