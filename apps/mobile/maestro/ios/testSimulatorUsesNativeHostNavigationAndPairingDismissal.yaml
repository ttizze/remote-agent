appId: dev.remoteagent.mobile.ios
name: testSimulatorUsesNativeHostNavigationAndPairingDismissal
---
- runFlow: connect.yaml
- extendedWaitUntil:
    visible: 検証 Host、.*
    timeout: 10000
- tapOn:
    id: tasks.menu
- tapOn:
    id: tasks.settings
- tapOn:
    id: settings.connections
- assertVisible:
    id: pairing.manual
- tapOn:
    id: profiles\.(?!add$).+
    text: .*検証 Host.*
- extendedWaitUntil:
    visible:
      id: environment.enabled
    timeout: 10000
- tapOn:
    id: BackButton
- assertVisible:
    id: pairing.manual
- tapOn:
    id: BackButton
- tapOn:
    id: settings.close
- extendedWaitUntil:
    visible:
      id: tasks.list
    timeout: 15000
- tapOn:
    id: tasks.menu
- tapOn:
    id: tasks.settings
- tapOn:
    id: settings.connections
- tapOn:
    id: pairing.manual
- tapOn:
    id: pairing.contents
- inputText: invalid invitation
- tapOn:
    id: pairing.submit
- extendedWaitUntil:
    visible:
      id: notice
    timeout: 5000
- runScript:
    file: assert-absent.generated.js
    env:
      # XCUIElementTypeKeyboard from Xcode's public XCUIElementTypes.h.
      ABSENT_ELEMENT_TYPE: "19"
- tapOn:
    id: pairing.contents
- runScript:
    file: input-pairing.generated.js
    env:
      REFRESH_PAIRING: "true"
- tapOn:
    id: pairing.submit
- extendedWaitUntil:
    visible:
      id: pairing.change
    timeout: 10000
- tapOn:
    id: pairing.change
- tapOn:
    id: pairing.manual
- tapOn:
    id: pairing.contents
- runScript:
    file: input-pairing.generated.js
    env:
      REFRESH_PAIRING: "false"
- tapOn:
    id: pairing.submit
- extendedWaitUntil:
    visible:
      id: pairing.host
      text: 検証 Host
    timeout: 10000
- assertVisible:
    id: pairing.recipients
- copyTextFrom:
    id: pairing.recipients
- assertTrue: ${maestro.copiedText.length > 0}
- runScript:
    file: assert-absent.generated.js
    env:
      ABSENT_ID: ^(pairing.scan|tasks.list)$
- tapOn:
    id: pairing.confirm
- pressKey: Home
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: tasks.list
    timeout: 30000
- runScript:
    file: assert-absent.generated.js
    env:
      ABSENT_ID: ^pairing.manual$
- extendedWaitUntil:
    visible: 検証 Host、.*
    timeout: 10000
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tasks.list
    timeout: 30000
- extendedWaitUntil:
    visible: 検証 Host、.*
    timeout: 10000
