appId: com.ttizze.b-codex
---
- launchApp
- extendedWaitUntil:
    visible:
      id: pairing.manual
    timeout: 30000
- tapOn:
    id: pairing.manual
- extendedWaitUntil:
    visible:
      id: pairing.contents
    timeout: 10000
- tapOn:
    id: pairing.contents
- runScript:
    file: input-pairing.js
    env:
      REFRESH_PAIRING: "true"
- tapOn:
    id: pairing.submit
- extendedWaitUntil:
    visible:
      id: pairing.host
      text: 検証 Host
    timeout: 10000
- assertVisible:
    id: pairing.recipients
- copyTextFrom:
    id: pairing.recipients
- assertTrue: ${maestro.copiedText.length > 0}
- runScript:
    file: assert-absent.js
    env:
      ABSENT_ID: ^(pairing.scan|tasks.list)$
- takeScreenshot: pairing-before-consent
- tapOn:
    id: pairing.confirm
- extendedWaitUntil:
    visible:
      id: tasks.list
    timeout: 30000
- runFlow:
    when:
      visible:
        id: tasks.project.simulator-project
        text: .*閉じています.*
    commands:
      - tapOn:
          id: tasks.project.simulator-project
