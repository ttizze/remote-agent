[workspace]
members = [
    "apps/desktop",
    "crates/agent-core",
    "crates/agent-cli",
    "crates/agent-ffi",
    "crates/codex-app-server",
    "crates/conversation-presentation",
    "crates/host-daemon",
    "crates/host-protocol",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
base64 = "0.23.1"
futures-util = "0.3.31"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
url = "2.5.4"
zeroize = "1.8.1"
