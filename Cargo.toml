[workspace]
members = [
    "apps/desktop",
    "crates/agent-core",
    "crates/agent-protocol",
    "crates/agent-transport",
    "crates/agent-ffi",
    "crates/codex-app-server",
    "crates/bex-process",
    "crates/host-daemon",
    "crates/xtask",
    "crates/orchestration",
    "crates/provider-adapters",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
anyhow = "1.0.104"
dunce = "1.0.5"
base64 = "0.23.1"
futures-util = "0.3.31"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
url = "2.5.4"
zeroize = "1.8.1"

[patch.crates-io]
# UDP rebind recovery: https://github.com/n0-computer/net-tools/pull/235
netwatch = { git = "https://github.com/ttizze/net-tools", rev = "1d54cca14f47ebfa20a75234e8a08351d9f5a8d4" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }
