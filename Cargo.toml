[workspace]
members = [
    "apps/desktop",
    "crates/agent-core",
    "crates/agent-protocol",
    "crates/agent-transport",
    "crates/agent-cli",
    "crates/agent-ffi",
    "crates/codex-app-server",
    "crates/bex-process",
    "crates/host-daemon",
    "crates/xtask",
    "crates/host-fixture",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
anyhow = "1.0.104"
base64 = "0.23.1"
futures-util = "0.3.31"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
url = "2.5.4"
zeroize = "1.8.1"

[patch.crates-io]
# iroh 1.1.0 with UDP rebind recovery: https://github.com/n0-computer/iroh/pull/4558
iroh = { git = "https://github.com/ttizze/iroh", rev = "0bdd6383dadb151c825142a8e0311d163d83b054" }
iroh-base = { git = "https://github.com/ttizze/iroh", rev = "0bdd6383dadb151c825142a8e0311d163d83b054" }
iroh-dns = { git = "https://github.com/ttizze/iroh", rev = "0bdd6383dadb151c825142a8e0311d163d83b054" }
iroh-relay = { git = "https://github.com/ttizze/iroh", rev = "0bdd6383dadb151c825142a8e0311d163d83b054" }
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }
