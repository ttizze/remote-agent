included:
  - apps/mobile/iosApp/Bex
  - apps/mobile/iosApp/Shared
  - apps/mobile/iosApp/ActivityExtension
  - apps/mobile/iosApp/ShareExtension

strict: true
check_for_updates: false

# Keep the default rule set and thresholds. Formatting uses .swiftformat.
opt_in_rules:
  - empty_count
  - empty_string
  - unused_optional_binding
