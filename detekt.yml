config:
  validation: true
  warningsAsErrors: true

# Compose functions returning Unit use PascalCase, as in the official guide.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # Preserve the default test policy with AGP 9's renamed source sets.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**', '**/androidDeviceTest/**', '**/jsTest/**', '**/iosTest/**']

complexity:
  LongParameterList:
    ignoreDefaultParameters: true

style:
  MagicNumber:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**', '**/androidDeviceTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts']
